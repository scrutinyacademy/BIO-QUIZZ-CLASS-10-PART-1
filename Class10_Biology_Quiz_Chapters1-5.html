/* ─────────────────── CHAPTER 2 : RESPIRATION ─────────────────── */
2:[
 {q:"The overall equation for aerobic respiration is:",o:["C₆H₁₂O₆+O₂→CO₂+H₂O","C₆H₁₂O₆+6O₂→6CO₂+6H₂O+Energy","6CO₂+6H₂O→C₆H₁₂O₆+6O₂","C₆H₁₂O₆→2C₂H₅OH+2CO₂"],a:1,d:"e",e:"Aerobic respiration: C₆H₁₂O₆ + 6O₂ → 6CO₂ + 6H₂O + 38 ATP. Glucose is completely oxidised to CO₂ and water."},
 {q:"The first stage of cellular respiration, occurring in the cytoplasm, is:",o:["Krebs cycle","Electron transport chain","Glycolysis","Oxidative phosphorylation"],a:2,d:"e",e:"Glycolysis splits one glucose (6C) into two pyruvate (3C) molecules in the cytoplasm, yielding a net 2 ATP and 2 NADH."},
 {q:"Net ATP produced in glycolysis from one glucose molecule is:",o:["4","2","38","36"],a:1,d:"m",e:"Glycolysis invests 2 ATP and produces 4 ATP — net gain of 2 ATP. It also produces 2 NADH and 2 pyruvate."},
 {q:"The Krebs cycle takes place in the:",o:["Cytoplasm","Thylakoid membrane","Mitochondrial matrix","Inner mitochondrial membrane"],a:2,d:"m",e:"Pyruvate enters the mitochondria, is converted to acetyl-CoA, and enters the Krebs cycle in the matrix, producing CO₂, NADH, FADH₂ and 2 ATP per glucose."},
 {q:"Mitochondria are called the 'powerhouse of the cell' because:",o:["They produce glucose","They are the largest organelle","They generate most ATP through aerobic respiration","They contain DNA"],a:2,d:"e",e:"Mitochondria house the Krebs cycle (matrix) and electron transport chain (inner membrane), producing ~34 of the 38 ATP from aerobic respiration."},
 {q:"Anaerobic respiration in yeast produces:",o:["Lactic acid only","CO₂ and water","Ethanol + CO₂ + 2 ATP","Glucose + O₂"],a:2,d:"e",e:"Yeast fermentation: glucose → 2 ethanol + 2CO₂ + 2ATP. Only 2 ATP produced because glucose is incompletely oxidised without oxygen."},
 {q:"Anaerobic respiration in human muscle cells produces:",o:["Ethanol + CO₂","Lactic acid + 2 ATP","Pyruvate + O₂","CO₂ + H₂O"],a:1,d:"e",e:"When O₂ is insufficient (intense exercise), pyruvate is reduced to lactic acid in muscle cells, producing 2 ATP. Lactic acid build-up causes muscle fatigue."},
 {q:"The 'term respiration' in cellular biology refers to:",o:["Breathing only","The complete process from inhalation to ATP production in cells","Only the exchange of gases in lungs","Pumping of blood"],a:1,d:"m",e:"Cellular respiration encompasses gas exchange, transport, and intracellular oxidation of fuel molecules. The Latin root 'respirare' ('to breathe') was extended to include all these steps."},
 {q:"Normal adult breathing rate at rest is approximately:",o:["5–8 breaths/min","15–18 breaths/min","30–40 breaths/min","50–60 breaths/min"],a:1,d:"e",e:"The resting respiratory rate for adults is 12–20 breaths per minute, with ~15–18 being typical. It increases during exercise to match higher O₂ demand."},
 {q:"Alveoli are specially adapted for gas exchange. Which adaptation is NOT correct?",o:["Extremely thin walls (one cell thick)","Moist inner lining","Dense capillary network","Thick muscular walls for contraction"],a:3,d:"m",e:"Alveoli have very thin walls to minimise diffusion distance. They have no muscle; their shape is maintained by surfactant and surrounding tissue."},
 {q:"Oxygen is transported in blood mainly as:",o:["Dissolved in plasma","Bicarbonate ions","Oxyhemoglobin in RBCs","Carbaminohemoglobin"],a:2,d:"e",e:"~98% of O₂ is transported bound to haemoglobin as oxyhaemoglobin. Each haemoglobin carries 4 O₂ molecules."},
 {q:"Most CO₂ from tissues is transported in blood as:",o:["Dissolved CO₂ in plasma","Carboxyhaemoglobin","Bicarbonate ions (HCO₃⁻)","CO₂ bound directly to plasma proteins"],a:2,d:"m",e:"~70% of CO₂ is converted to bicarbonate ions (CO₂ + H₂O → H₂CO₃ → H⁺ + HCO₃⁻) in RBCs by carbonic anhydrase, then transported in plasma."},
 {q:"The respiratory control centre is located in the:",o:["Cerebrum","Cerebellum","Medulla oblongata","Hypothalamus"],a:2,d:"m",e:"The medulla oblongata's respiratory centres (dorsal and ventral groups) detect blood CO₂/pH changes via chemoreceptors and regulate breathing rhythm."},
 {q:"Tidal volume is defined as:",o:["Maximum air exhaled forcibly","Volume of air in lungs after full exhalation","Volume of air inhaled/exhaled in one normal breath (~500 mL)","Total lung capacity"],a:2,d:"m",e:"Tidal volume (~500 mL in adults) is the air moved with each resting breath. During exercise it increases to meet elevated O₂ demand."},
 {q:"Vital capacity is:",o:["Air remaining after maximum exhalation","Maximum air inhaled + exhaled in one forced breath (~4.5 L)","Normal tidal volume","Functional residual capacity"],a:1,d:"h",e:"Vital capacity = tidal volume + inspiratory reserve volume + expiratory reserve volume (≈4.5 L). Residual volume (~1.2 L) cannot be expelled."},
 {q:"During inhalation, the diaphragm:",o:["Relaxes and moves upward","Contracts and flattens, increasing thoracic volume","Stays stationary","Moves sideways"],a:1,d:"e",e:"Diaphragm contraction causes it to flatten and descend; external intercostals raise ribs. Both increase thoracic volume, reducing pressure → air flows in."},
 {q:"The epiglottis prevents:",o:["Food entering the oesophagus","Food and drink entering the trachea during swallowing","Air entering the stomach","Acid reflux"],a:1,d:"e",e:"The epiglottis is a leaf-shaped cartilage flap that folds over the glottis during swallowing, directing food/liquid into the oesophagus and away from the airway."},
 {q:"Fermentation by yeast is exploited commercially in:",o:["Petrol production","Bread-making (CO₂ causes dough to rise) and alcohol production","Cheese from milk only","Making vinegar only"],a:1,d:"m",e:"Yeast ferments sugars → ethanol + CO₂. CO₂ makes dough rise in bread; ethanol is the alcohol in beverages. Both industries use yeast fermentation."},
 {q:"Emphysema is characterised by:",o:["Mucus blocking bronchi","Fluid in alveoli","Destruction of alveolar walls reducing gas exchange surface","Narrowing of trachea"],a:2,d:"h",e:"Emphysema (often caused by smoking) destroys alveolar walls, reducing surface area for diffusion, causing breathlessness and low blood O₂."},
 {q:"Energy released in respiration is stored as:",o:["Glucose","Glycogen","ATP","NADH"],a:2,d:"e",e:"ATP (adenosine triphosphate) is the universal energy currency. Hydrolysis of one ATP releases ~30 kJ/mol of free energy for cellular work."},
 {q:"Which process yields the most ATP per glucose molecule?",o:["Anaerobic fermentation in yeast","Anaerobic respiration in muscle","Aerobic respiration","Glycolysis only"],a:2,d:"e",e:"Aerobic respiration produces ~38 ATP per glucose via glycolysis, Krebs cycle and oxidative phosphorylation. Anaerobic routes yield only 2 ATP."},
 {q:"Lactic acid produced during intense exercise is:",o:["Permanently stored in muscles","Excreted in urine only","Transported to the liver and reconverted to glucose (Cori cycle)","Broken down immediately in muscle"],a:2,d:"h",e:"Lactic acid diffuses from muscle into blood → liver, where it is converted back to pyruvate then to glucose (gluconeogenesis) when oxygen is available — the Cori cycle."},
 {q:"Gas exchange across alveolar membranes occurs by:",o:["Active transport","Osmosis","Simple diffusion along concentration gradients","Facilitated diffusion"],a:2,d:"e",e:"O₂ diffuses from alveolar air (high pO₂) into blood; CO₂ diffuses from blood (high pCO₂) into alveolus — both by passive diffusion without energy expenditure."},
 {q:"Residual volume refers to:",o:["Air moved per breath","Air remaining in lungs after maximal exhalation (~1.2 L)","Maximum inspiratory volume","Functional residual capacity"],a:1,d:"h",e:"~1.2 L of air remains in the lungs even after forced exhalation. This prevents alveolar collapse and ensures continuous gas exchange between breaths."},
 {q:"In insects, gas exchange occurs through:",o:["Lungs","Gills","Tracheal system with spiracles","Book lungs only"],a:2,d:"m",e:"Insects have a tracheal system — branching chitin-lined tubes (tracheae and tracheoles) that open via spiracles on the body surface and deliver O₂ directly to tissues."},
 {q:"Which best describes the role of haemoglobin in CO₂ transport?",o:["It carries most CO₂ as bicarbonate","~23% of CO₂ binds to haemoglobin forming carbaminohaemoglobin","It only carries O₂, not CO₂","It converts CO₂ to bicarbonate"],a:1,d:"h",e:"~23% of CO₂ is carried as carbaminohaemoglobin (CO₂ binds to the globin protein portion, not the haem group). The majority (~70%) is bicarbonate."},
 {q:"What increases breathing rate automatically?",o:["Decreased blood O₂ alone","Increased blood CO₂ (lowering blood pH)","Increased blood glucose","Decreased heart rate"],a:1,d:"m",e:"Central chemoreceptors in the medulla primarily respond to rising pCO₂/falling pH, signalling the respiratory centre to increase rate and depth of breathing."},
 {q:"Pyruvate is the end product of:",o:["Krebs cycle","Electron transport chain","Glycolysis","Oxidative phosphorylation"],a:2,d:"m",e:"Glycolysis breaks glucose (C₆) into two pyruvate (C₃) molecules in the cytoplasm. Pyruvate then either enters the Krebs cycle (aerobic) or is reduced (anaerobic)."},
 {q:"The electron transport chain produces ATP through:",o:["Substrate-level phosphorylation","Chemiosmosis — proton gradient across inner mitochondrial membrane drives ATP synthase","Direct phosphorylation of ADP by enzymes","Photophosphorylation"],a:1,d:"h",e:"NADH and FADH₂ donate electrons to ETC complexes, pumping H⁺ ions into the intermembrane space. H⁺ flows back through ATP synthase (chemiosmosis), producing ~34 ATP."},
 {q:"Gaseous exchange in fish occurs through:",o:["Lungs","Skin only","Gills — countercurrent exchange with water","Tracheal system"],a:2,d:"m",e:"Fish gill lamellae have rich capillary networks. Blood and water flow in opposite directions (countercurrent), maximising the O₂ concentration gradient for efficient absorption."},
 {q:"Lenticels in woody plant stems allow:",o:["Photosynthesis to occur in bark","Gas exchange for stem cells during respiration","Water absorption","Sugar translocation"],a:1,d:"m",e:"Lenticels are pores in the bark (periderm) with loosely packed cells, allowing O₂ to diffuse in and CO₂ out for respiration of living cells in woody stems and roots."},
 {q:"NADH produced during respiration is important because:",o:["It is the end product of aerobic respiration","It carries electrons to the electron transport chain for ATP production","It directly breaks down glucose","It carries CO₂ to the lungs"],a:1,d:"h",e:"NADH (and FADH₂) are electron carriers. They donate electrons to ETC Complex I/II, driving proton pumping and ultimately the synthesis of ATP via ATP synthase."},
 {q:"Aerobic respiration produces __ times more ATP than anaerobic respiration.",o:["5","10","19 (38 vs 2 ATP)","50"],a:2,d:"m",e:"Aerobic: ~38 ATP/glucose. Anaerobic: 2 ATP/glucose. Aerobic is ~19 times more efficient because glucose is completely oxidised to CO₂ + H₂O."},
 {q:"The pleura is:",o:["Muscle of the diaphragm","Double-layered membrane surrounding each lung; pleural fluid reduces friction","The inner lining of alveoli","Cartilage rings in the trachea"],a:1,d:"m",e:"The visceral and parietal pleura enclose each lung. Pleural fluid between the layers lubricates breathing movements, reducing friction during ventilation."},
 {q:"Which chemical is produced when yeast is used to make wine?",o:["Lactic acid","Acetic acid","Ethanol (ethyl alcohol)","Glycerol"],a:2,d:"e",e:"Wine production: Saccharomyces cerevisiae ferments grape sugars anaerobically: glucose → 2 ethanol + 2CO₂ + 2ATP."},
 {q:"Asthma is caused by:",o:["Destruction of alveoli","Inflammation and narrowing of bronchioles, restricting airflow","Fluid in the pleural cavity","Hardening of trachea cartilage"],a:1,d:"m",e:"Asthma involves chronic inflammation of bronchioles with smooth muscle spasm and mucus secretion, reducing airway diameter and causing wheezing and breathlessness."},
 {q:"Respiration in plants occurs:",o:["Only in leaves during the day","Only in roots","In all living cells 24 hours a day","Only during the dark period"],a:2,d:"e",e:"All living plant cells (roots, stems, leaves) respire continuously to produce ATP. Unlike photosynthesis, respiration is not restricted to light periods or to green cells."},
 {q:"Acetyl-CoA enters the Krebs cycle from:",o:["Direct glycolysis","Oxidative decarboxylation of pyruvate in the mitochondrial matrix","The electron transport chain","The cytoplasm directly"],a:1,d:"h",e:"Pyruvate crosses into the mitochondrial matrix where the pyruvate dehydrogenase complex converts it to acetyl-CoA + CO₂ + NADH before it enters the Krebs cycle."},
 {q:"Carbon dioxide produced during respiration is removed from body tissues by:",o:["O₂ in blood","Diffusing into capillary blood and being transported to the lungs","Active pumping by heart","Lymphatic system"],a:1,d:"e",e:"CO₂ (produced in cellular respiration) diffuses down its concentration gradient from cells into capillary blood, is transported mainly as HCO₃⁻ to the lungs, and exhaled."},
 {q:"The structure of a mitochondrion that is important for ATP synthesis is:",o:["Outer membrane","Intermembrane space only","Inner membrane with its cristae (folds)","Ribosomes in matrix"],a:2,d:"h",e:"Cristae (inner membrane folds) dramatically increase the surface area for ETC complexes and ATP synthase, maximising ATP production capacity."},
 {q:"During vigorous exercise, extra CO₂ produced causes:",o:["Blood pH to rise, slowing breathing","Blood pH to fall (more acidic), stimulating increased breathing rate","No change in breathing","Reduced heart rate"],a:1,d:"m",e:"More CO₂ → more carbonic acid → lower blood pH → medullary chemoreceptors detect acidosis → respiratory centre increases breathing rate and depth to expel CO₂."},
 {q:"Which gas is released during fermentation of glucose by yeast?",o:["O₂","CO₂","N₂","H₂"],a:1,d:"e",e:"Fermentation: C₆H₁₂O₆ → 2C₂H₅OH + 2CO₂. The CO₂ released causes bread dough to rise and creates bubbles in fermented beverages."},
 {q:"Surfactant in the lungs:",o:["Is a muscle that controls breathing","Reduces surface tension in alveoli, preventing their collapse","Transports oxygen in blood","Filters bacteria from inhaled air"],a:1,d:"h",e:"Surfactant (dipalmitoyl phosphatidylcholine) is secreted by type II alveolar cells. It reduces surface tension, preventing alveolar collapse on exhalation."},
 {q:"The term 'oxygen debt' refers to:",o:["Lack of O₂ in blood","Extra O₂ needed after anaerobic exercise to oxidise accumulated lactic acid","Normal O₂ consumption at rest","Loss of O₂ from blood"],a:1,d:"m",e:"After intense exercise, extra O₂ is consumed to metabolise lactic acid (convert it back to glucose or CO₂+H₂O) — this repayment of 'borrowed' anaerobic energy is oxygen debt."},
 {q:"The total ATP yield from one glucose in aerobic respiration is approximately:",o:["2","8","38","100"],a:2,d:"m",e:"Glycolysis: 2 ATP + 2 NADH; pyruvate decarboxylation: 2 NADH; Krebs cycle: 2 ATP + 6 NADH + 2 FADH₂; ETC: ~34 ATP. Total ≈ 38 ATP."},
 {q:"Which of the following is NOT a product of aerobic respiration?",o:["Carbon dioxide","Water","Ethanol","ATP"],a:2,d:"e",e:"Ethanol is an end product of anaerobic fermentation in yeast, NOT aerobic respiration. Aerobic respiration produces CO₂, H₂O, and ATP only."},
 {q:"Respiratory substrate refers to:",o:["The enzyme that drives respiration","The molecule oxidised in respiration (primarily glucose) to release energy","The membranes where respiration occurs","The oxygen molecule"],a:1,d:"m",e:"The respiratory substrate is the organic molecule oxidised for energy. Glucose is primary, but fatty acids and amino acids can serve as substrates when glucose is scarce."},
 {q:"Breathing movements in humans are driven by:",o:["Heart contractions","Lung elasticity alone","Contraction and relaxation of diaphragm and intercostal muscles","Brain electrical impulses directly moving air"],a:2,d:"e",e:"Rhythmic contraction of the diaphragm (↓ = inspire) and external intercostal muscles (raise ribs = inspire) changes thoracic volume, creating pressure differences that drive airflow."},
 {q:"FAD is reduced to FADH₂ during:",o:["Glycolysis","Krebs cycle (succinate → fumarate step)","Electron transport chain","Fermentation"],a:1,d:"h",e:"In the Krebs cycle, succinate dehydrogenase oxidises succinate to fumarate, reducing FAD → FADH₂. This is the only step in the cycle that reduces FAD rather than NAD⁺."},
 {q:"Pneumonia causes difficulty in breathing because:",o:["It destroys bronchi","Alveoli fill with fluid/pus, reducing surface area for gas exchange","It paralyses the diaphragm","It removes haemoglobin from blood"],a:1,d:"m",e:"Pneumonia is an infection causing inflammation and fluid/pus accumulation in alveoli. This reduces the gas exchange surface area and diffusion, causing hypoxia."},
],

/* ─────────────────── CHAPTER 3 : TRANSPORTATION ─────────────────── */
3:[
 {q:"The human heart has how many chambers?",o:["2","3","4","6"],a:2,d:"e",e:"The human heart has 4 chambers: 2 atria (upper, thin-walled receiving chambers) and 2 ventricles (lower, thick-walled pumping chambers)."},
 {q:"Double circulation means blood passes through the heart:",o:["Once per complete circuit","Twice per complete circuit (pulmonary + systemic)","Three times per circuit","Four times per circuit"],a:1,d:"m",e:"Pulmonary circulation: right side → lungs → left side. Systemic circulation: left side → body → right side. Blood passes through the heart twice per complete trip around the body."},
 {q:"The SA node is called the pacemaker because:",o:["It pumps blood","It generates spontaneous electrical impulses that initiate each heartbeat","It regulates blood pressure","It controls the AV node only"],a:1,d:"m",e:"The sino-atrial (SA) node in the right atrial wall generates rhythmic action potentials (~70/min) that spread across both atria, then through the AV node to ventricles."},
 {q:"Oxygenated blood returns from the lungs to the:",o:["Right atrium","Right ventricle","Left atrium via pulmonary veins","Left ventricle directly"],a:2,d:"e",e:"The four pulmonary veins carry oxygenated blood from the lungs to the left atrium — the only veins that carry oxygenated blood."},
 {q:"Arteries are characterised by:",o:["Thin walls and valves","Thick, elastic, muscular walls; carry blood away from heart","Carrying only deoxygenated blood","Having valves to prevent backflow"],a:1,d:"e",e:"Arterial walls have thick smooth muscle and elastic tissue to withstand and dampen the high pressure generated by ventricular contraction."},
 {q:"Capillaries enable exchange of materials because:",o:["They are the widest vessels","Their walls are only one endothelial cell thick","They have valves","They carry the most blood"],a:1,d:"e",e:"Capillary walls are a single layer of squamous endothelial cells — the minimal barrier for O₂, nutrients, CO₂, and waste to diffuse between blood and interstitial fluid."},
 {q:"The component of blood responsible for immune defence is:",o:["Erythrocytes (RBCs)","Thrombocytes (platelets)","Leukocytes (WBCs)","Plasma proteins"],a:2,d:"e",e:"WBCs (neutrophils, lymphocytes, monocytes, etc.) combat infection through phagocytosis, antibody production, and cytotoxic killing of pathogens and infected cells."},
 {q:"Haemoglobin is an iron-containing protein that:",o:["Clots blood","Transports O₂ in red blood cells","Carries CO₂ only","Provides immunity"],a:1,d:"e",e:"Each haemoglobin molecule has 4 iron-porphyrin (haem) groups, each binding one O₂ in the lungs to form oxyhaemoglobin, releasing O₂ in respiring tissues."},
 {q:"Normal human blood pressure is:",o:["80/120 mmHg","120/80 mmHg","60/40 mmHg","180/90 mmHg"],a:1,d:"e",e:"120 mmHg systolic (ventricular contraction) / 80 mmHg diastolic (ventricular relaxation) is considered normal. Persistent >140/90 is hypertension."},
 {q:"Platelets (thrombocytes) function in:",o:["O₂ transport","Immune responses","Blood clotting — forming a platelet plug and releasing clotting factors","Carrying hormones"],a:2,d:"e",e:"At wound sites, platelets aggregate, release clotting factors, and trigger the coagulation cascade, ultimately forming a fibrin clot to stop bleeding."},
 {q:"The tricuspid valve is located:",o:["Between left atrium and left ventricle","Between right ventricle and pulmonary artery","Between right atrium and right ventricle","At the aortic root"],a:2,d:"m",e:"The tricuspid (right atrioventricular) valve has 3 cusps and prevents backflow from right ventricle into right atrium during ventricular systole."},
 {q:"Veins differ from arteries structurally in that veins:",o:["Have thicker walls","Have semilunar valves to prevent backflow of blood","Have no valves","Carry only oxygenated blood"],a:1,d:"m",e:"Most veins contain semilunar (pocket) valves that open when blood flows toward the heart and close to prevent backflow, especially important against gravity in limbs."},
 {q:"Xylem is responsible for transporting __ in plants.",o:["Organic solutes (sugars) from leaves to roots","Water and dissolved minerals from roots to all aerial parts","Amino acids throughout the plant","Hormones between organs"],a:1,d:"e",e:"Xylem vessels are dead, lignified cells forming continuous tubes from roots to leaves. They carry the transpiration stream (water + dissolved minerals) upward."},
 {q:"Phloem transports __ in plants.",o:["Water and mineral salts upward","Organic solutes (mainly sucrose) from source to sink — bidirectionally","Only hormones","Water downward only"],a:1,d:"e",e:"Phloem (sieve tubes + companion cells) transports sugars, amino acids and hormones from photosynthetic sources (leaves) to sinks (roots, fruits, growing tips)."},
 {q:"Transpiration pull is the main mechanism pulling water up xylem. It works because:",o:["Root pressure is very strong","Capillary action alone is enough for tall trees","Evaporation from stomata creates tension; cohesive water column is pulled up","Phloem pumps water upward"],a:2,d:"m",e:"Cohesion-tension mechanism: evaporation → negative water potential at leaf → tension transmitted through cohesive water column in xylem → water absorbed from soil."},
 {q:"Root pressure contributes to water rise in plants primarily:",o:["In tall trees","At night when transpiration is low","Only during the day","In all conditions equally"],a:1,d:"m",e:"Root pressure (due to active ion uptake creating osmotic gradient) is significant only when transpiration is minimal (night, low temperature, high humidity)."},
 {q:"Translocation in phloem requires:",o:["No energy","Energy (ATP) for active loading/unloading of sucrose","Only gravity","Only osmosis"],a:1,d:"h",e:"Companion cells use ATP to load sucrose into sieve tubes (source), raising osmotic pressure and drawing water in. At the sink, sucrose is unloaded, reversing the gradient."},
 {q:"Lymph is:",o:["Blood without RBCs","Tissue fluid that has entered lymph capillaries and is returned to venous blood","A type of hormone","Digestive fluid"],a:1,d:"m",e:"Fluid leaks from blood capillaries into tissue spaces (interstitial fluid). Lymph capillaries drain excess fluid → lymph vessels → lymph nodes → back into blood via thoracic duct."},
 {q:"Blood group O is called universal donor because:",o:["O blood has all antigens","O RBCs lack A and B antigens, so are not attacked by recipient's antibodies","O blood has no antibodies","O blood is most common"],a:1,d:"m",e:"Group O erythrocytes lack A and B surface antigens; recipients of any ABO blood group will not mount an antibody response against them, making O⁻ the safest donation."},
 {q:"Cardiac output = __ × __.",o:["Blood pressure × heart rate","Heart rate × stroke volume","Tidal volume × breathing rate","Systolic pressure × diastolic pressure"],a:1,d:"m",e:"Cardiac output (L/min) = Heart rate (beats/min) × Stroke volume (mL/beat). At rest: ~70 × 70 mL = ~5 L/min; during intense exercise up to ~25 L/min."},
 {q:"Atherosclerosis is caused by:",o:["High blood RBC count","Build-up of fatty plaques (atheroma) in arterial walls, narrowing the lumen","Low blood pressure","Thin arterial walls"],a:1,d:"m",e:"Atherosclerosis: endothelial damage → LDL cholesterol deposits → foam cells → plaques. Plaque build-up narrows arteries, raising blood pressure and risk of thrombosis."},
 {q:"What is the function of semilunar valves in the heart?",o:["Prevent backflow from atria to ventricles","Prevent backflow from aorta/pulmonary artery into ventricles after systole","Allow blood from veins into atria","Open during diastole to fill ventricles"],a:1,d:"m",e:"Aortic and pulmonary semilunar valves prevent backflow of blood into the ventricles after ejection. They are forced open by ventricular systole and snap shut in diastole."},
 {q:"The lymphatic system plays a role in:",o:["Transporting O₂","Filtering and returning interstitial fluid to blood, and mounting immune responses","Producing RBCs","Carrying glucose to cells"],a:1,d:"m",e:"Lymph capillaries collect excess interstitial fluid and large molecules (proteins, fats from lacteals). Lymph nodes filter pathogens, and lymphocytes provide immune surveillance."},
 {q:"Guard cells open stomata when they become:",o:["Flaccid (lose water)","Turgid (gain water and bow outward)","Dead","Larger in darkness"],a:1,d:"m",e:"When guard cells absorb water, they become turgid. Their unevenly thickened inner walls cause them to bow, enlarging the stomatal pore."},
 {q:"Which ions trigger stomatal opening?",o:["Na⁺ and Cl⁻","K⁺ (potassium ions) entering guard cells in light","Ca²⁺ only","Mg²⁺"],a:1,d:"h",e:"In light, proton pumps move H⁺ out of guard cells; K⁺ flows in to maintain electrical neutrality, lowering water potential → water enters by osmosis → stomata open."},
 {q:"Pulmonary artery carries __ blood; pulmonary veins carry __ blood.",o:["Oxygenated; deoxygenated","Deoxygenated; oxygenated","Oxygenated; oxygenated","Deoxygenated; deoxygenated"],a:1,d:"e",e:"The pulmonary artery (right ventricle → lungs) is the only artery carrying deoxygenated blood. Pulmonary veins (lungs → left atrium) are the only veins with oxygenated blood."},
 {q:"Guttation refers to:",o:["Loss of water vapour through stomata","Secretion of water droplets from hydathodes due to root pressure","Absorption of dew by leaves","Photosynthesis at night"],a:1,d:"m",e:"When transpiration is low (cool, humid nights) but root pressure is high, xylem sap is forced out through hydathodes at leaf margins — appearing as water droplets at dawn."},
 {q:"Osmosis is the movement of water from:",o:["High solute concentration to low solute concentration","High water potential to low water potential through a selectively permeable membrane","Low water potential to high water potential","Any direction regardless of concentration"],a:1,d:"m",e:"Osmosis: water molecules move passively down the water potential gradient (from dilute = high Ψ to concentrated = low Ψ) across a selectively permeable membrane."},
 {q:"Plasma makes up approximately __ % of blood volume.",o:["25%","45%","55%","90%"],a:2,d:"m",e:"Plasma constitutes ~55% of blood volume. It is ~90% water, carrying proteins (albumin, fibrinogen, antibodies), nutrients, hormones, and waste products."},
 {q:"In sickle-cell anaemia, haemoglobin is abnormal because:",o:["It contains too much iron","A single amino acid substitution (glutamic acid → valine) makes HbS polymerise at low O₂","The haem group is absent","There are too many haemoglobin molecules"],a:1,d:"h",e:"HbS polymerises when deoxygenated, distorting RBCs into a sickle shape that blocks capillaries and is haemolysed quickly, causing anaemia and painful crises."},
 {q:"Xylem vessels are formed from cells that are __ at maturity.",o:["Living with large vacuoles","Dead, with no cytoplasm; walls lignified for strength and impermeability","Living and metabolically active","Thin-walled and transparent"],a:1,d:"m",e:"Xylem vessel elements undergo programmed death at maturity; their end walls dissolve to form a continuous lumen. Lignin strengthens walls and makes them water-tight."},
 {q:"The pericardium is:",o:["A heart chamber","The muscle layer of the heart wall","A double-layered sac enclosing the heart, containing pericardial fluid","The outer lining of blood vessels"],a:2,d:"m",e:"The pericardium (fibrous outer + serous inner layers) surrounds the heart. Pericardial fluid between the serous layers reduces friction during heartbeat."},
 {q:"Hypertension (persistently elevated BP) can lead to:",o:["Stronger heart and lower stroke risk","Damage to arterial walls, increased risk of stroke, heart attack and kidney disease","Lower cardiac output","Reduced risk of atherosclerosis"],a:1,d:"m",e:"Sustained high blood pressure mechanically stresses arterial walls, promotes atherosclerosis, can lead to aneurysm, stroke, myocardial infarction, and kidney damage."},
 {q:"Companion cells in phloem provide:",o:["Structural support only","Metabolic support and ATP to sieve tube elements, which lack a nucleus","Water to the sieve tube","Mineral transport"],a:1,d:"h",e:"Sieve tube elements (phloem conducting cells) lack nuclei and most organelles. Adjacent companion cells provide proteins, ATP and regulatory molecules via plasmodesmata."},
 {q:"Turgor pressure in plant cells is important for:",o:["Cell division only","Maintaining cell shape (rigidity) and driving cell expansion during growth","Photosynthesis","Mineral absorption"],a:1,d:"m",e:"Water entering the central vacuole pushes outward (turgor pressure) against the cell wall. Turgor provides mechanical support to non-woody plants and drives cell elongation."},
 {q:"Cohesion of water molecules in xylem is due to:",o:["Covalent bonds","Hydrogen bonds between water molecules","Ionic bonds","Van der Waals forces only"],a:1,d:"h",e:"Water molecules form hydrogen bonds with each other (cohesion) and with xylem walls (adhesion). This cohesion allows the water column to withstand the tension created by transpiration."},
 {q:"What is cardiac diastole?",o:["Ventricular contraction pumping blood out","Relaxation phase — atria and ventricles fill with blood","The time between two heartbeats","The closing of semilunar valves"],a:1,d:"m",e:"Diastole is the relaxation phase of the cardiac cycle. Atria fill from veins; then AV valves open and ventricles fill passively (and by atrial systole)."},
 {q:"Anaemia results from:",o:["Too many red blood cells","Deficiency of functional haemoglobin or RBCs, reducing O₂-carrying capacity","Excess platelets","High white cell count"],a:1,d:"e",e:"Anaemia (iron deficiency, B12/folate deficiency, haemolysis, blood loss) reduces O₂ transport capacity, causing fatigue, pallor, and breathlessness."},
 {q:"Transpiration from leaves is greatest when:",o:["It is cold, dark and humid","It is hot, bright, windy and dry","Stomata are closed","Leaves are wilted"],a:1,d:"m",e:"Transpiration rate increases with: high temperature (more evaporation), bright light (stomata open), wind (removes saturated air), and low humidity (steep diffusion gradient)."},
 {q:"Minerals enter root hair cells against their concentration gradient by:",o:["Osmosis","Diffusion","Active transport using ATP","Simple diffusion"],a:2,d:"m",e:"Mineral ions (K⁺, NO₃⁻, PO₄³⁻ etc.) are at lower concentration in soil water than in root cells. ATP-driven pumps actively transport them across the root cell membrane."},
 {q:"The sinoatrial node is located in the:",o:["Left ventricle","Septum between ventricles","Right atrial wall","Left atrium"],a:2,d:"m",e:"The SA node (pacemaker) is embedded in the posterior wall of the right atrium near the superior vena cava entry. Its intrinsic rate is ~70 impulses/min."},
 {q:"Blood clotting requires which ion as a cofactor?",o:["Na⁺","K⁺","Ca²⁺","Mg²⁺"],a:2,d:"h",e:"Calcium ions (Ca²⁺) are essential cofactors for several steps in the coagulation cascade, including activation of factors X and II (prothrombin → thrombin)."},
 {q:"The hepatic portal vein carries:",o:["Oxygenated blood to the liver from the heart","Nutrient-rich blood from the intestines to the liver","Deoxygenated blood from liver to heart","Lymph from the intestines"],a:1,d:"h",e:"Absorbed nutrients from the small intestine are collected by the hepatic portal vein and carried to the liver for processing (glucose storage, amino acid deamination, detoxification)."},
 {q:"Pressure flow hypothesis explains transport in phloem by:",o:["Gravity pulling sugar down","High turgor at source (loading) and low turgor at sink (unloading) creating a pressure gradient driving flow","Root pressure driving sugars upward","Active pumping at every node"],a:1,d:"h",e:"Münch's pressure flow: high solute concentration at source lowers water potential → water enters sieve tubes → high turgor → solution flows under pressure to sinks with lower turgor."},
 {q:"Erythrocytes (RBCs) in mature form lack:",o:["Haemoglobin","Cell membrane","Nucleus (and most organelles)","The ability to carry O₂"],a:2,d:"m",e:"Mature mammalian RBCs are anucleate (no nucleus) and lack mitochondria. This maximises space for haemoglobin and prevents the cell from using the O₂ it carries."},
 {q:"What is the role of lymph nodes?",o:["Produce red blood cells","Filter lymph, removing pathogens and debris; house lymphocytes for immune response","Produce plasma proteins","Regulate blood pressure"],a:1,d:"m",e:"Lymph nodes contain macrophages (engulf pathogens) and lymphocytes (B and T cells). Lymph is filtered as it passes through, triggering immune responses when antigens are detected."},
 {q:"An experiment to observe the internal structure of a mammalian heart requires:",o:["Microscope and slides only","A preserved/fresh mammalian heart, dissection scissors and scalpel, and dissection board","X-ray machine","Only a magnifying glass"],a:1,d:"m",e:"Heart dissection requires a preserved heart (e.g. sheep/pig), dissection instruments, a dissection board, and gloves. Structures observed include chambers, valves, and major vessels."},
 {q:"Which blood vessel carries blood from the left ventricle to the body?",o:["Pulmonary artery","Superior vena cava","Aorta","Pulmonary vein"],a:2,d:"e",e:"The aorta (largest artery, ~2.5 cm diameter) arises from the left ventricle and distributes oxygenated blood through its branches to all body systems."},
],

/* ─────────────────── CHAPTER 4 : EXCRETION ─────────────────── */
4:[
 {q:"Excretion is best defined as:",o:["Egestion of undigested food","Removal of metabolic waste products produced within cells from the body","Breathing out CO₂ only","Sweating for temperature control"],a:1,d:"e",e:"Excretion removes metabolic waste (urea, CO₂, excess water, mineral salts) produced by cellular reactions. It differs from egestion (removal of undigested food never inside cells)."},
 {q:"The functional unit of the kidney is the:",o:["Ureter","Glomerulus","Nephron","Renal pelvis"],a:2,d:"e",e:"Each kidney contains ~1 million nephrons — tubular units that filter blood (glomerulus + Bowman's capsule), reabsorb useful substances, and produce urine."},
 {q:"The main nitrogenous excretory product in humans is:",o:["Ammonia","Uric acid","Urea","Creatine"],a:2,d:"e",e:"Urea is synthesised in the liver from toxic ammonia (released during amino acid deamination) via the ornithine (urea) cycle, then excreted by the kidneys."},
 {q:"Ultrafiltration of blood in the kidney occurs in:",o:["Loop of Henle","Collecting duct","Proximal convoluted tubule","Bowman's capsule surrounding the glomerulus"],a:3,d:"m",e:"High hydrostatic pressure in glomerular capillaries forces plasma (minus large proteins and cells) through the glomerular filtration membrane into Bowman's space."},
 {q:"Which substances are normally ABSENT from urine?",o:["Urea and creatinine","Glucose and proteins (normally fully reabsorbed or not filtered)","Urea and water","Salt"],a:1,d:"m",e:"Glucose is completely reabsorbed in the PCT; large proteins don't filter through. Their presence in urine (glycosuria, proteinuria) indicates kidney malfunction or diabetes."},
 {q:"ADH (antidiuretic hormone) acts on the collecting duct to:",o:["Increase urine volume","Decrease water reabsorption","Increase water reabsorption, producing concentrated urine","Increase sodium excretion"],a:2,d:"m",e:"ADH (vasopressin) released by the posterior pituitary inserts aquaporin channels in collecting duct cells, increasing water permeability → more water reabsorbed → concentrated urine."},
 {q:"The hormone aldosterone from the adrenal cortex acts on kidneys to:",o:["Increase water excretion","Increase Na⁺ reabsorption in DCT/collecting duct, raising blood volume and pressure","Decrease K⁺ secretion","Dilute urine"],a:1,d:"h",e:"Aldosterone upregulates Na⁺/K⁺-ATPase and apical Na⁺ channels in DCT and collecting duct → more Na⁺ (and water by osmosis) reabsorbed, more K⁺ secreted."},
 {q:"Urea is formed in the __ from __.",o:["Kidneys; amino acids","Liver; deamination of excess amino acids","Pancreas; glucose","Spleen; old red blood cells"],a:1,d:"m",e:"In the liver, excess amino acids are deaminated (amino group removed → ammonia + keto acid). Ammonia is converted to urea in the ornithine cycle — less toxic and more soluble."},
 {q:"Haemodialysis replaces kidney function by:",o:["Transplanting a new kidney","Passing patient's blood through a machine with a semi-permeable membrane that filters waste","Using the patient's own lymph nodes","Stimulating the liver to remove urea"],a:1,d:"e",e:"In haemodialysis, blood is pumped across a semi-permeable dialysis membrane. Waste products (urea, creatinine, K⁺) diffuse into dialysis fluid down concentration gradients."},
 {q:"Reabsorption in the proximal convoluted tubule (PCT) includes:",o:["Urea reabsorption primarily","100% glucose, amino acids, most water, Na⁺, K⁺, HCO₃⁻","Only water reabsorption","Only protein reabsorption"],a:1,d:"m",e:"PCT reabsorbs essentially all filtered glucose and amino acids (active transport), ~65–70% of Na⁺/water, and most HCO₃⁻. This recovers valuable nutrients before urine is concentrated."},
 {q:"The skin acts as an excretory organ through:",o:["Absorbing minerals","Secreting sweat containing water, NaCl, small amounts of urea, and lactic acid","Producing vitamin D only","Regulating blood pressure"],a:1,d:"e",e:"Sweat glands secrete sweat (~99% water + electrolytes + trace urea/lactic acid) for both thermoregulation and minor excretion. Sweat is not a major excretory route but does remove waste."},
 {q:"Bilirubin is:",o:["A kidney hormone","A yellow pigment from haemoglobin breakdown; excreted in bile","A urine protein","An adrenal hormone"],a:1,d:"m",e:"When the liver breaks down haemoglobin from old RBCs, the haem group is converted to biliverdin then bilirubin. Bilirubin is secreted into bile; its accumulation causes jaundice."},
 {q:"Jaundice is caused by:",o:["Excess urea in blood","Excess bilirubin in blood (from liver disease or bile duct obstruction) causing yellowing of skin/eyes","Kidney failure","Excess glucose in urine"],a:1,d:"m",e:"When bilirubin accumulates in plasma (liver can't excrete it fast enough, or bile duct is blocked), it deposits in skin and sclera, causing the yellow discolouration of jaundice."},
 {q:"Aquatic animals (fish) mainly excrete nitrogenous waste as:",o:["Urea","Uric acid","Ammonia","Creatinine"],a:2,d:"m",e:"Fish excrete ammonia directly across gill membranes. Ammonia is highly toxic but is immediately diluted by surrounding water, so no expensive urea conversion is needed."},
 {q:"Birds and reptiles excrete nitrogenous waste mainly as:",o:["Urea","Ammonia","Uric acid (semi-solid, water-conserving)","Creatinine"],a:2,d:"m",e:"Uric acid requires minimal water for excretion (it is nearly insoluble → forms paste). This adaptation conserves water in arid environments and prevents nitrogenous waste accumulating in eggs."},
 {q:"Osmoregulation refers to:",o:["Regulation of osmosis in food","Maintenance of constant osmotic concentration of body fluids","Regulation of blood pressure only","Control of water in plants"],a:1,d:"m",e:"Osmoregulation controls water and solute balance to maintain constant body fluid osmolarity. Kidneys are the primary osmoregulatory organs in mammals, working with ADH and aldosterone."},
 {q:"The Loop of Henle creates:",o:["Filtration pressure in glomerulus","An osmotic gradient in the medulla enabling the collecting duct to concentrate urine","A site for glucose reabsorption","Blood pressure in renal artery"],a:1,d:"h",e:"The hairpin loop of Henle's countercurrent multiplier generates a high NaCl/urea osmolarity in the medullary interstitium. This osmotic gradient draws water out of the collecting duct."},
 {q:"Peritubular capillaries surround the:",o:["Glomerulus","Nephron tubules (PCT, loop, DCT, collecting duct)","Renal pelvis","Ureter"],a:1,d:"m",e:"Peritubular capillaries arise from the efferent arteriole of the glomerulus and surround the tubules, collecting reabsorbed substances and maintaining blood flow through the kidney."},
 {q:"Renal threshold is:",o:["The maximum urine volume per day","The plasma concentration of a substance above which it appears in urine (e.g. glucose ≈180 mg/dL)","The normal urine pH","The blood pressure in glomerulus"],a:1,d:"h",e:"Renal threshold: at plasma glucose <~180 mg/dL, all filtered glucose is reabsorbed. Above this, transport carriers are saturated and glucose 'spills' into urine (glycosuria)."},
 {q:"The lungs contribute to excretion by removing:",o:["Urea only","CO₂ and water vapour — both metabolic waste products","Ammonia only","All nitrogenous waste"],a:1,d:"e",e:"CO₂ is a waste product of aerobic respiration in all cells. Water vapour is also exhaled. Both are excreted via the lungs, making the lungs important excretory organs."},
 {q:"Uremia is a medical emergency caused by:",o:["Excess glucose in blood","Toxic accumulation of urea and other waste in blood due to kidney failure","Dehydration only","Vitamin deficiency"],a:1,d:"m",e:"If both kidneys fail, urea, creatinine, K⁺ and acids accumulate in blood (uraemia), causing nausea, confusion, pericarditis, and potentially fatal cardiac arrhythmias."},
 {q:"Kidney stones (renal calculi) are mainly composed of:",o:["Protein deposits","Calcium oxalate or calcium phosphate crystals","Uric acid only","Blood clots"],a:1,d:"m",e:"Most kidney stones (70–80%) are calcium oxalate. Risk factors include dehydration, high oxalate diet, hyperparathyroidism. They cause severe loin pain (renal colic) when passing."},
 {q:"Renin is secreted by __ cells in response to __.",o:["Glomerular; high blood glucose","Juxtaglomerular; low blood pressure/volume","Distal tubule; high Na⁺","Collecting duct; high osmolarity"],a:1,d:"h",e:"Juxtaglomerular apparatus cells secrete renin when afferent arteriole pressure falls (or when Na⁺ is low). Renin initiates angiotensin II→aldosterone, raising BP and Na⁺ reabsorption."},
 {q:"Daily urine output in healthy adults is approximately:",o:["100–200 mL","500 mL","1–1.5 L","5 L"],a:2,d:"m",e:"Normal urine output is ~1–1.5 L/day (varies with water intake, exercise, climate). Oliguria (<400 mL/day) or polyuria (>3 L/day) indicate possible kidney disorders."},
 {q:"Plants excrete waste primarily by:",o:["Urinating","Storing resins, tannins, and crystals in vacuoles, bark, or shed leaves; releasing CO₂/O₂ through stomata","Excreting through root hairs only","Releasing urea into soil"],a:1,d:"m",e:"Plants store secondary metabolites (tannins, alkaloids, resins, calcium oxalate crystals) as metabolic waste in bark, vacuoles, or leaves shed seasonally. Gaseous wastes exit via stomata."},
 {q:"Deamination removes __ from amino acids in the liver.",o:["Carboxyl groups","Amino groups (-NH₂), producing ammonia + keto acid","Carbon atoms","Hydrogen atoms"],a:1,d:"m",e:"Deamination: amino acid → keto acid (used for energy via gluconeogenesis or Krebs) + NH₃ (combined with CO₂ → urea in ornithine cycle). This is how nitrogen from protein is excreted."},
 {q:"Suggestions for a person with complete kidney failure would include:",o:["Drink more water only","Haemodialysis or peritoneal dialysis to filter blood, or kidney transplant","Only dietary protein reduction","Antibiotics only"],a:1,d:"e",e:"Complete bilateral renal failure (end-stage renal disease) requires replacement therapy: haemodialysis (3×/week), continuous ambulatory peritoneal dialysis, or kidney transplant."},
 {q:"The GFR (glomerular filtration rate) in healthy adults is approximately:",o:["1 L/day","18 L/day","125 mL/min (~180 L/day)","500 mL/day"],a:2,d:"h",e:"Normal GFR ≈125 mL/min = 180 L/day. Of this enormous filtrate, ~99% is reabsorbed; only ~1–1.5 L becomes urine, representing efficient selective reabsorption."},
 {q:"Tubular secretion moves substances __ .",o:["From tubular fluid back into blood","From blood into tubular fluid (in addition to filtration)","From urine into the ureter","From the collecting duct backward"],a:1,d:"m",e:"Tubular secretion is the active transport of additional waste (drugs, H⁺, K⁺, creatinine) from peritubular capillaries into tubular lumen, supplementing filtration to increase excretion."},
 {q:"In peritoneal dialysis, the __ is used as the dialysis membrane.",o:["Kidney itself","Patient's own peritoneal membrane (lining of abdominal cavity)","Semi-permeable synthetic membrane","Skin"],a:1,d:"h",e:"Dialysis fluid is infused into the peritoneal cavity; waste diffuses from blood through the peritoneum into the fluid, which is then drained. Can be performed at home continuously."},
 {q:"Erythropoietin (EPO) is produced by the kidneys to:",o:["Control blood pressure only","Stimulate bone marrow to produce red blood cells","Regulate urine concentration","Control Na⁺ balance"],a:1,d:"h",e:"EPO is a hormone secreted by peritubular cells in the kidney cortex in response to hypoxia. It stimulates erythropoiesis in red bone marrow, increasing RBC count and O₂-carrying capacity."},
 {q:"Counter-current exchange in the loop of Henle refers to:",o:["Blood and filtrate flowing in the same direction","Descending and ascending limbs having opposite flows creating a multiplied osmotic gradient","Two loops flowing in the same direction","Countercurrent exchange between arteries and veins"],a:1,d:"h",e:"Descending limb (water permeable) and ascending limb (Na⁺ active transport) flow in opposite directions. This countercurrent multiplier builds up high interstitial osmolarity in the medulla."},
 {q:"Urinary incontinence refers to:",o:["Inability to produce urine","Involuntary leakage of urine due to loss of sphincter control","Presence of blood in urine","Excess urine production"],a:1,d:"m",e:"Urinary incontinence (involuntary urination) results from loss of voluntary control of the external urethral sphincter, due to nerve damage, pelvic floor weakness, or prostate issues."},
 {q:"Proteinuria indicates:",o:["Normal kidney function","Glomerular membrane damage allowing large proteins (albumin) to be filtered into urine","High protein diet","Excess amino acid synthesis"],a:1,d:"m",e:"Healthy glomeruli retain plasma proteins. Proteinuria (protein in urine) signals damage to the glomerular basement membrane, as seen in diabetic nephropathy or glomerulonephritis."},
 {q:"Antidiuretic hormone (ADH) is synthesised in the __ and released from __.",o:["Kidney; adrenal gland","Anterior pituitary; posterior pituitary","Hypothalamus; posterior pituitary","Adrenal cortex; kidney"],a:2,d:"h",e:"ADH (vasopressin) is produced by hypothalamic neurons and transported to the posterior pituitary for storage and release when blood osmolarity rises or blood pressure falls."},
 {q:"Cortical nephrons vs. juxtamedullary nephrons:",o:["Both are identical","Juxtamedullary nephrons have longer loops of Henle reaching deep into medulla for greater urine concentration","Cortical nephrons are longer","Both are found in renal pelvis"],a:1,d:"h",e:"Juxtamedullary nephrons (~15%) have long loops of Henle extending deep into the medulla, generating a steep osmotic gradient — enabling production of very concentrated urine."},
 {q:"Which organ is primarily responsible for detoxification of blood?",o:["Kidney","Spleen","Liver","Lungs"],a:2,d:"m",e:"The liver removes drugs, alcohol, bilirubin, ammonia, and other toxins from portal blood through oxidation, conjugation, and excretion into bile — a vital detoxification function."},
 {q:"The renin-angiotensin-aldosterone system (RAAS) responds to:",o:["High blood glucose","Low blood pressure/volume or low Na⁺; results in raised BP and Na⁺ retention","High blood pressure","Excess K⁺"],a:1,d:"h",e:"Low renal perfusion → renin → angiotensinogen → angiotensin I → ACE → angiotensin II → vasoconstriction + aldosterone → Na⁺/water retention → restored BP and volume."},
 {q:"Sweat contains which of the following?",o:["Glucose and proteins","Water, NaCl, trace urea, and lactic acid","Only water","Urea in large amounts like urine"],a:1,d:"m",e:"Sweat is mostly water (~99%) with dissolved NaCl, small amounts of urea, lactic acid and K⁺. It serves thermoregulation primarily; excretion is a minor secondary function."},
 {q:"What is meant by tubular reabsorption?",o:["Secreting extra waste into tubular fluid","The recovery of useful substances (glucose, water, amino acids) from tubular filtrate back into blood","Filtering blood in the glomerulus","Producing urine in the collecting duct"],a:1,d:"e",e:"Tubular reabsorption moves valuable filtered substances (glucose, amino acids, electrolytes, water) from the tubular lumen back across tubular cells into peritubular capillaries."},
 {q:"Which acid-base function do kidneys serve?",o:["Only excretion of urea","Regulating blood pH by excreting H⁺ or HCO₃⁻ as needed","Only regulating Na⁺","Only regulating K⁺"],a:1,d:"h",e:"Kidneys maintain blood pH 7.35–7.45 by: secreting H⁺ (when acidic), reabsorbing HCO₃⁻ (when alkaline), and producing ammonium to buffer excreted acid."},
 {q:"The experiment to show kidney's filtration function uses iodine to detect:",o:["CO₂ in urine","Presence of glucose in urine (absence normally)","Starch – absent from filtrate confirming size-based filtration","Protein in urine – absent normally"],a:2,d:"h",e:"Iodine is sometimes used in classroom models to show selective filtration — large starch molecules don't pass through semi-permeable membranes, unlike small glucose molecules."},
 {q:"Dialysis fluid in haemodialysis contains:",o:["High urea to draw urea from blood","Normal plasma concentrations of glucose and electrolytes (so only waste diffuses out)","No glucose, to remove all glucose","High K⁺ to replace lost potassium"],a:1,d:"h",e:"Dialysis fluid (dialysate) has normal plasma concentrations of useful solutes; waste products (urea, creatinine, excess K⁺) diffuse out from blood down concentration gradients, while glucose and electrolytes are retained."},
],

/* ─────────────────── CHAPTER 5 : CONTROL & COORDINATION ─────────────────── */
5:[
 {q:"The basic structural and functional unit of the nervous system is the:",o:["Synapse","Axon","Neuron (nerve cell)","Spinal cord"],a:2,d:"e",e:"Neurons are specialised cells that receive, process and transmit electrochemical signals. They have a cell body, dendrites (input) and axon (output)."},
 {q:"Dendrites of a neuron:",o:["Carry impulses away from the cell body","Insulate the axon","Receive incoming signals and conduct them toward the cell body","Form myelin sheath"],a:2,d:"e",e:"Dendrites are branched extensions of the cell body that receive signals from other neurons or sensory receptors and conduct them toward the cell body for integration."},
 {q:"The myelin sheath around an axon is formed by __ cells in the PNS.",o:["Astrocytes","Schwann cells","Oligodendrocytes","Microglia"],a:1,d:"m",e:"Schwann cells wrap around peripheral nerve axons, forming the myelin sheath. Myelin (high lipid content) insulates the axon and dramatically speeds up impulse conduction via saltatory conduction."},
 {q:"A synapse is:",o:["A node of Ranvier","The junction between two neurons (or neuron and effector) where signals are transmitted chemically","A type of receptor","The gap between dendrites and cell body"],a:1,d:"e",e:"At a synapse, an action potential in the pre-synaptic neuron triggers neurotransmitter release into the synaptic cleft; neurotransmitters bind post-synaptic receptors, continuing or inhibiting the signal."},
 {q:"A reflex action is characterised by being:",o:["Slow and voluntary","Fast, involuntary and not requiring conscious thought — processed in spinal cord","Controlled only by the cerebrum","Requiring learning"],a:1,d:"e",e:"Spinal reflexes (withdrawal, knee-jerk) bypass the brain — receptor → sensory neuron → interneuron in spinal cord → motor neuron → effector. Speed (~20 ms) far exceeds conscious response."},
 {q:"The correct path in a reflex arc is:",o:["Receptor→Motor neuron→CNS→Sensory neuron→Effector","Receptor→Sensory neuron→CNS interneuron→Motor neuron→Effector","Brain→Motor neuron→Receptor","Effector→Motor neuron→Brain"],a:1,d:"e",e:"Reflex arc: Stimulus→Receptor→Sensory (afferent) neuron→Interneuron (spinal cord)→Motor (efferent) neuron→Effector (muscle/gland). The brain is informed but does not initiate the response."},
 {q:"The cerebellum is primarily responsible for:",o:["Thinking and memory","Regulating heart rate","Coordination of muscular movement, balance and posture","Secreting hormones"],a:2,d:"e",e:"The cerebellum receives proprioceptive, vestibular and visual input, fine-tuning motor commands from the cerebrum to ensure smooth, precise, coordinated movement and balance."},
 {q:"The medulla oblongata controls:",o:["Higher cognitive functions","Voluntary movement","Vital involuntary functions — breathing rate, heart rate, blood pressure","Hormone secretion only"],a:2,d:"m",e:"The medulla (lower brainstem) contains cardiac, respiratory and vasomotor centres regulating autonomic functions. Damage to the medulla is rapidly fatal."},
 {q:"Phototropism in plants refers to growth in response to:",o:["Gravity","Water","Light","Touch"],a:2,d:"e",e:"Phototropism: shoots grow toward light (positive phototropism) due to auxin redistributing away from the illuminated side, causing greater elongation on the shaded side."},
 {q:"Auxin (IAA) promotes:",o:["Leaf fall","Cell elongation at the site of application (low concentration)","Root elongation at high concentration","Fruit ripening"],a:1,d:"m",e:"Auxin at low concentrations stimulates cell elongation by loosening cell walls, enabling water uptake and expansion. High concentrations actually inhibit growth (especially in roots)."},
 {q:"Roots show positive geotropism, meaning they grow:",o:["Toward light","Away from gravity (upward)","Toward gravity (downward)","Toward water only"],a:2,d:"e",e:"Root cap cells are more sensitive to auxin — high auxin on the lower side (due to gravity) inhibits root elongation there, so the lower side grows less → roots bend downward."},
 {q:"The pituitary gland is called the 'master gland' because:",o:["It is the largest endocrine gland","It secretes tropic hormones controlling most other endocrine glands","It produces insulin","It regulates only growth"],a:1,d:"m",e:"The anterior pituitary secretes TSH (thyroid), ACTH (adrenal cortex), FSH/LH (gonads), GH (growth), and prolactin. The posterior pituitary releases ADH and oxytocin (made in hypothalamus)."},
 {q:"Insulin is produced by __ cells of the pancreatic islets and:",o:["Alpha cells; raises blood glucose","Beta cells; lowers blood glucose by promoting cellular uptake and glycogen synthesis","Delta cells; digests proteins","Acinar cells; secretes digestive enzymes"],a:1,d:"m",e:"Beta cells (β-cells) in the islets of Langerhans secrete insulin when blood glucose rises. Insulin promotes glucose uptake into cells and glycogen synthesis in liver/muscle."},
 {q:"Glucagon is secreted by __ cells and:",o:["Beta cells; lowers blood glucose","Alpha cells; raises blood glucose by stimulating glycogenolysis and gluconeogenesis","Delta cells; lowers blood pressure","Acinar cells; aids digestion"],a:1,d:"m",e:"Alpha (α) cells secrete glucagon when blood glucose falls. Glucagon binds liver receptors → cAMP → glycogenolysis (glycogen→glucose) + gluconeogenesis → blood glucose rises."},
 {q:"Thyroxine (T4) is produced by the thyroid gland and:",o:["Lowers metabolic rate","Regulates basal metabolic rate, growth, and brain development; requires dietary iodine","Raises blood glucose","Controls calcium metabolism only"],a:1,d:"m",e:"Thyroxine accelerates metabolism in virtually all cells. It is essential for normal growth, brain development (critical in neonates), and thermoregulation. Synthesis requires 4 iodine atoms."},
 {q:"Iodine deficiency causes:",o:["Diabetes mellitus","Cushing's syndrome","Goitre (enlargement of thyroid gland)","Addison's disease"],a:2,d:"e",e:"Without iodine, thyroxine cannot be synthesised. Persistent TSH stimulation (pituitary trying to stimulate inadequate thyroid) causes thyroid hypertrophy → visible neck swelling (goitre)."},
 {q:"Adrenaline (epinephrine) is secreted by the __ and prepares the body for:",o:["Thyroid; sleep","Adrenal cortex; digestion","Adrenal medulla; fight-or-flight response","Pancreas; protein synthesis"],a:2,d:"m",e:"Adrenaline (from adrenal medulla) rapidly increases heart rate, blood pressure, blood glucose and blood flow to muscles — the 'fight-or-flight' (sympathoadrenal) stress response."},
 {q:"The touch-me-not plant (Mimosa pudica) closing its leaflets when touched is an example of:",o:["Phototropism","Thigmotropism","Thigmonasty (non-directional nastic response to touch)","Hydrotropism"],a:2,d:"m",e:"Mimosa's rapid leaf folding is thigmonasty — a non-directional nastic movement. Potassium ions leave motor cells at the leaf pulvinus, reducing turgor pressure and causing leaflet collapse."},
 {q:"Geotropism (gravitropism) in plants is a growth response to:",o:["Light direction","Water availability","Gravity","Temperature"],a:2,d:"e",e:"Geotropism is the directional growth response to gravity. Roots: positive geotropism (grow down). Shoots: negative geotropism (grow up). Auxin redistribution by gravity mediates both."},
 {q:"The autonomic nervous system (ANS) controls:",o:["Voluntary skeletal muscle movement","Involuntary smooth muscle, cardiac muscle and gland secretion","Conscious thought","Sensory perception"],a:1,d:"m",e:"The ANS (sympathetic + parasympathetic divisions) regulates heart rate, blood pressure, digestion, pupil size, and glandular secretion — all below the level of conscious control."},
 {q:"The hypothalamus links the nervous and endocrine systems by:",o:["Directly producing insulin","Secreting releasing/inhibiting hormones that control anterior pituitary, and producing ADH/oxytocin","Controlling muscle movement","Being the site of reflex arcs"],a:1,d:"h",e:"The hypothalamus integrates neural and hormonal signals: it produces releasing/inhibiting factors (→ anterior pituitary) and synthesises ADH/oxytocin (stored in posterior pituitary)."},
 {q:"Growth hormone (GH) deficiency in childhood causes:",o:["Gigantism","Cretinism","Pituitary dwarfism — normal proportions but reduced stature","Acromegaly"],a:2,d:"m",e:"Insufficient GH in childhood slows linear bone growth → proportionate short stature (pituitary dwarfism). Excess GH in childhood causes gigantism; excess in adults causes acromegaly."},
 {q:"The resting membrane potential of a typical neuron is approximately:",o:["+70 mV","-40 mV","-70 mV","0 mV"],a:2,d:"h",e:"At rest, the inside of a neuron is ~−70 mV relative to the outside, maintained by Na⁺/K⁺-ATPase (pumps 3 Na⁺ out, 2 K⁺ in) and differential membrane permeability."},
 {q:"An action potential is triggered when the membrane potential reaches:",o:["−70 mV (resting)","Threshold (~−55 mV), causing rapid depolarisation","0 mV only","+ 70 mV"],a:1,d:"h",e:"When depolarisation reaches threshold (≈−55 mV), voltage-gated Na⁺ channels open, rapid Na⁺ influx depolarises membrane to +30–40 mV (the all-or-none action potential)."},
 {q:"Acetylcholine is a neurotransmitter released at:",o:["Adrenergic synapses in the sympathetic NS","Neuromuscular junctions and many CNS and parasympathetic synapses","Only within the brain","Only in pain fibres"],a:1,d:"m",e:"ACh is released by motor neurons at the neuromuscular junction (causes muscle contraction), at most parasympathetic post-ganglionic synapses, and many brain synapses."},
 {q:"The sympathetic nervous system, when activated, causes:",o:["Slowing of heart rate","Increased digestion and salivation","Fight-or-flight: increased HR, dilation of airways, raised blood glucose, reduced digestion","Pupil constriction"],a:2,d:"m",e:"Sympathetic activation prepares the body for emergency: ↑HR, ↑BP, dilated bronchioles and pupils, vasoconstriction in gut, vasodilatation in skeletal muscle, glycogenolysis."},
 {q:"The parasympathetic nervous system promotes:",o:["Fight-or-flight responses","Rest and digest: slowed heart rate, increased digestion, pupil constriction","Release of adrenaline","Increased blood glucose"],a:1,d:"m",e:"Parasympathetic ('rest and digest') dominates at rest: slows heart via vagus nerve, promotes gut motility/secretion, constricts pupils, lowers blood pressure, promotes urination."},
 {q:"Gibberellin promotes:",o:["Fruit drop","Stomatal closure under drought","Stem elongation and seed germination by breaking dormancy","Root growth only"],a:2,d:"m",e:"Gibberellins stimulate internode elongation (stem growth), mobilise starch reserves in germinating seeds (via α-amylase induction), and can promote fruit development."},
 {q:"Abscisic acid (ABA) is the 'stress hormone' in plants because:",o:["It promotes growth","It closes stomata during water stress and promotes seed/bud dormancy","It causes fruit ripening","It promotes cell division"],a:1,d:"m",e:"ABA accumulates under drought: it triggers rapid stomatal closure (guard cell K⁺ efflux → water loss → flaccid), slows metabolism, and promotes dormancy — conserving water and energy."},
 {q:"Ethylene (ethene) plant hormone:",o:["Promotes seed dormancy","Inhibits fruit ripening","Promotes fruit ripening, leaf/fruit abscission, and inhibits elongation growth","Only promotes cell division"],a:2,d:"m",e:"Ethylene (gaseous hormone) triggers: fruit ripening (colour, softening), leaf and fruit abscission, and senescence. It inhibits stem elongation. Used commercially to ripen bananas."},
 {q:"Cytokinin plant hormone promotes:",o:["Leaf yellowing (senescence)","Stomatal closure","Cell division (cytokinesis) and delays leaf senescence","Root elongation only"],a:2,d:"m",e:"Cytokinins (kinetin, zeatin) promote cell division and differentiation, delay chlorophyll degradation (anti-senescence), and in tissue culture are used to induce shoot formation."},
 {q:"The all-or-none law of nerve impulse means:",o:["Nerves fire at variable strengths","Once threshold is reached, a full-sized action potential fires; below threshold, nothing fires","Different neurons have different-sized impulses","Impulse size depends on stimulus intensity"],a:1,d:"h",e:"All-or-none: a stimulus either fails to reach threshold (no impulse) or exceeds it (full action potential of standard amplitude). Stimulus intensity is encoded by frequency, not impulse size."},
 {q:"The cerebrum controls:",o:["Heart rate only","Balance and coordination","Conscious thought, memory, voluntary movement, sensory perception, language, personality","Breathing only"],a:2,d:"m",e:"The cerebral cortex (two hemispheres, four lobes each) is responsible for all higher brain functions: reasoning, memory, emotions, voluntary motor control, and sensory integration."},
 {q:"Node of Ranvier in myelinated axons enables:",o:["Neurotransmitter storage","Saltatory conduction — impulse 'jumps' from node to node, greatly increasing speed","Myelin synthesis","Synapse formation"],a:1,d:"h",e:"Myelin insulates the axon between nodes. Depolarisation skips from node to node (saltatory = jumping), increasing conduction velocity from ~0.5 m/s (unmyelinated) to ~80–120 m/s."},
 {q:"Hydrotropism is a plant growth response toward:",o:["Light","Gravity","Water","Touch"],a:2,d:"e",e:"Hydrotropism: roots grow toward higher moisture gradients in soil. This helps plants locate water efficiently — especially important in dry or uneven water-distribution conditions."},
 {q:"Which hormone raises blood calcium levels?",o:["Calcitonin (lowers it)","Parathyroid hormone (PTH) — raises blood Ca²⁺","Thyroxine","Glucagon"],a:1,d:"h",e:"PTH (parathyroid gland) raises blood Ca²⁺ by stimulating bone resorption (osteoclasts), increasing renal Ca²⁺ reabsorption, and activating vitamin D for intestinal Ca²⁺ absorption."},
 {q:"Dopamine is a neurotransmitter associated with:",o:["Muscle contraction only","The reward and pleasure pathway; deficiency in Parkinson's disease","Pain suppression only","Cardiac regulation only"],a:1,d:"h",e:"Dopamine (produced in substantia nigra and VTA) mediates reward, motivation, and fine motor control. Its deficiency causes Parkinson's tremors and rigidity; excess relates to schizophrenia."},
 {q:"The thalamus acts as:",o:["The emotional centre","A relay station routing all sensory information (except smell) to appropriate cortical areas","The pituitary regulator","A centre for involuntary reflexes"],a:1,d:"h",e:"The thalamus is the brain's sensory gateway — all sensory inputs (visual, auditory, somatosensory) synapse in thalamic nuclei before relay to the appropriate primary cortical area."},
 {q:"Nastic movements in plants are __ directional stimuli.",o:["Responses to directional stimuli","Responses to non-directional stimuli — direction of movement independent of stimulus direction","Growth responses only","Driven by auxin redistribution"],a:1,d:"m",e:"Nastic movements (thigmonasty in Mimosa, photonasty in daisies) are responses to non-directional stimuli. The direction of response is determined by plant anatomy, not stimulus direction."},
 {q:"The hypothalamus regulates body temperature by:",o:["Directly contracting muscles","Acting as a thermostat — detecting blood temperature deviation and triggering heat loss (sweating, vasodilation) or heat gain (shivering, vasoconstriction)","Secreting insulin","Controlling breathing rate only"],a:1,d:"m",e:"Anterior hypothalamus (heat loss) triggers sweating and cutaneous vasodilation when body temperature rises. Posterior hypothalamus (heat conservation) triggers shivering and vasoconstriction when cold."},
 {q:"Feedback inhibition in the endocrine system means:",o:["Hormones always increase production of other hormones","When hormone levels reach the target, they inhibit the releasing signal, maintaining homeostasis","Hormones never stop being secreted","Positive feedback always occurs"],a:1,d:"m",e:"Negative feedback: high thyroxine → inhibits TSH from pituitary and TRH from hypothalamus → less stimulation of thyroid → thyroxine falls → inhibition lifts. Classic homeostatic loop."},
 {q:"Serotonin deficiency in the brain is associated with:",o:["Parkinson's disease","Depression and mood disorders","Hyperthyroidism","Diabetes"],a:1,d:"h",e:"Serotonin (5-HT) regulates mood, sleep, appetite, and social behaviour. Its depletion is linked to major depression, anxiety, and OCD. SSRIs raise synaptic serotonin levels."},
 {q:"Cortisol (glucocorticoid) is released from the adrenal cortex in response to:",o:["Low blood glucose only","Stress (via CRH→ACTH pathway) and maintains blood glucose, suppresses immune response","Exercise only","Excess calcium"],a:1,d:"h",e:"ACTH from the pituitary stimulates adrenal cortex to release cortisol. Cortisol promotes gluconeogenesis, fat mobilisation, and anti-inflammatory effects — a sustained stress response."},
 {q:"In plants, auxin is produced mainly in:",o:["Root tips only","Shoot apical meristems and young leaves — then transported to elongation zones","Old leaves","Flowers only"],a:1,d:"m",e:"IAA is synthesised from tryptophan in shoot apex and young leaves. Polar auxin transport (PAT) moves it basipetally (downward in shoots), controlling elongation, apical dominance, and tropisms."},
 {q:"Apical dominance is caused by:",o:["High cytokinin in shoot tip","High auxin from shoot apex suppressing growth of lateral buds","High gibberellin in roots","Low ABA"],a:1,d:"h",e:"Auxin produced at the shoot apex moves down and inhibits outgrowth of lateral (axillary) buds — apical dominance. Removing the apex removes auxin source → lateral buds grow (bushy plant)."},
 {q:"The 'knee-jerk reflex' involves the patellar tendon being struck, which:",o:["Travels to the brain and back","Directly activates a 2-neuron reflex arc (sensory→motor) in the spinal cord with no interneuron","Requires 5 neuron connections","Is controlled by the cerebellum"],a:1,d:"h",e:"The patellar reflex is monosynaptic: tendon stretch → muscle spindle → Ia afferent → directly synapse on alpha motor neuron in spinal cord → quadriceps contracts. No interneuron required."},
 {q:"Which division of the nervous system controls voluntary skeletal muscle movement?",o:["Autonomic nervous system","Parasympathetic division","Somatic (voluntary) nervous system","Sympathetic division"],a:2,d:"m",e:"The somatic nervous system comprises afferent sensory neurons and efferent motor neurons controlling voluntary skeletal muscles, under conscious control (e.g. walking, writing, speaking)."},
]
};

  const qs = QUIZ[cid];
  state[cid] = {
    order: [...Array(qs.length).keys()],
    answers: new Array(qs.length).fill(null), // null | true | false
    userPicks: new Array(qs.length).fill(null),
    current: 0,
    mode: 'seq',
    done: false
  };
}
CHAPTERS.forEach(c => initChState(c.id));
