<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Class 10 Biology Quiz — Chapters 1–5 | Scrutiny Academy</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ─── TOKENS ─────────────────────────────────────────── */
:root {
  --bg:       #07090f;
  --surface:  #0d1117;
  --card:     #131820;
  --card2:    #181f2a;
  --border:   rgba(255,255,255,0.07);
  --border2:  rgba(255,255,255,0.12);
  --text:     #e8edf5;
  --muted:    #6b7a90;
  --dim:      #3a4455;

  --ch1:  #f59e0b;   /* Nutrition      – amber   */
  --ch2:  #38bdf8;   /* Respiration    – sky     */
  --ch3:  #f43f5e;   /* Transportation – rose    */
  --ch4:  #a78bfa;   /* Excretion      – violet  */
  --ch5:  #34d399;   /* Coord.         – emerald */

  --correct: #22c55e;
  --wrong:   #ef4444;
  --radius:  14px;
  --shadow:  0 8px 32px rgba(0,0,0,.45);
}

/* ─── RESET ──────────────────────────────────────────── */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;font-size:16px}
body{
  font-family:'DM Sans',sans-serif;
  background:var(--bg);
  color:var(--text);
  min-height:100vh;
  overflow-x:hidden;
}
button{cursor:pointer;font-family:inherit;border:none;background:none}
a{color:inherit;text-decoration:none}
ul,ol{list-style:none}

/* ─── ANIMATED BG ────────────────────────────────────── */
.bg-grid{
  position:fixed;inset:0;pointer-events:none;z-index:0;
  background-image:
    linear-gradient(rgba(255,255,255,.025) 1px,transparent 1px),
    linear-gradient(90deg,rgba(255,255,255,.025) 1px,transparent 1px);
  background-size:48px 48px;
  mask-image:radial-gradient(ellipse 80% 80% at 50% 50%,black 0%,transparent 100%);
}

/* ─── HEADER ─────────────────────────────────────────── */
.site-header{
  position:relative;z-index:10;
  padding:28px 32px 24px;
  display:flex;align-items:center;gap:16px;
  border-bottom:1px solid var(--border);
  background:linear-gradient(180deg,rgba(13,17,23,.95) 0%,rgba(13,17,23,.7) 100%);
  backdrop-filter:blur(12px);
  position:sticky;top:0;
}
.logo-ring{
  width:52px;height:52px;border-radius:50%;
  border:2px solid rgba(255,255,255,.15);
  padding:2px;flex-shrink:0;
  box-shadow:0 0 0 4px rgba(255,255,255,.04);
  transition:box-shadow .3s;
}
.logo-ring:hover{box-shadow:0 0 0 6px rgba(255,255,255,.09)}
.logo-ring img{width:100%;height:100%;border-radius:50%;object-fit:cover;display:block}
.header-text{flex:1}
.header-title{
  font-family:'Syne',sans-serif;
  font-size:1.1rem;font-weight:800;
  letter-spacing:-.3px;
  line-height:1.2;
}
.header-sub{font-size:.75rem;color:var(--muted);margin-top:2px;font-weight:500}
.header-score-pill{
  font-family:'DM Mono',monospace;
  font-size:.75rem;font-weight:500;
  padding:6px 14px;border-radius:999px;
  background:rgba(255,255,255,.06);
  border:1px solid var(--border2);
  white-space:nowrap;
  transition:all .2s;
}

/* ─── CHAPTER TABS ───────────────────────────────────── */
.tab-bar{
  position:relative;z-index:9;
  display:flex;gap:0;
  overflow-x:auto;
  border-bottom:1px solid var(--border);
  background:rgba(13,17,23,.92);
  backdrop-filter:blur(8px);
  scrollbar-width:none;
}
.tab-bar::-webkit-scrollbar{display:none}
.tab-btn{
  position:relative;
  padding:14px 22px;
  font-family:'Syne',sans-serif;
  font-size:.8rem;font-weight:700;
  letter-spacing:.4px;
  color:var(--muted);
  white-space:nowrap;
  transition:color .2s;
  border-bottom:2px solid transparent;
  margin-bottom:-1px;
}
.tab-btn:hover{color:var(--text)}
.tab-btn.active{color:var(--text);border-bottom-color:var(--accent)}
.tab-btn .tab-num{
  font-family:'DM Mono',monospace;
  font-size:.65rem;
  margin-right:6px;
  opacity:.6;
}
.tab-btn .tab-check{
  font-size:.65rem;
  margin-left:6px;
  opacity:0;
  transition:opacity .2s;
}
.tab-btn.done .tab-check{opacity:1}

/* ─── MAIN LAYOUT ────────────────────────────────────── */
.main{
  position:relative;z-index:1;
  max-width:760px;
  margin:0 auto;
  padding:32px 20px 80px;
}

/* ─── CHAPTER PANEL ──────────────────────────────────── */
.chapter-panel{display:none}
.chapter-panel.active{display:block}

/* Chapter intro card */
.ch-intro{
  border-radius:20px;
  padding:28px 28px 22px;
  margin-bottom:24px;
  border:1px solid var(--border2);
  position:relative;overflow:hidden;
}
.ch-intro::before{
  content:'';position:absolute;inset:0;
  background:radial-gradient(ellipse 70% 80% at 0% 0%,rgba(255,255,255,.04) 0%,transparent 60%);
}
.ch-intro-top{display:flex;align-items:center;gap:14px;margin-bottom:16px}
.ch-icon-big{
  width:52px;height:52px;border-radius:14px;
  display:flex;align-items:center;justify-content:center;
  font-size:1.5rem;flex-shrink:0;
}
.ch-name{font-family:'Syne',sans-serif;font-size:1.5rem;font-weight:800;line-height:1.1}
.ch-tagline{font-size:.85rem;color:var(--muted);margin-top:4px}
.ch-meta-row{
  display:flex;gap:10px;flex-wrap:wrap;
  padding-top:16px;
  border-top:1px solid var(--border);
}
.ch-meta-pill{
  font-family:'DM Mono',monospace;
  font-size:.7rem;font-weight:500;
  padding:5px 12px;border-radius:999px;
  background:rgba(255,255,255,.06);
  border:1px solid var(--border2);
}

/* Progress strip */
.progress-strip{
  height:4px;
  background:var(--border);
  border-radius:999px;
  margin-bottom:24px;
  overflow:hidden;
}
.progress-fill{
  height:100%;
  border-radius:999px;
  width:0%;
  transition:width .5s cubic-bezier(.4,0,.2,1);
}
.progress-label{
  font-family:'DM Mono',monospace;
  font-size:.7rem;color:var(--muted);
  margin-bottom:8px;
  display:flex;justify-content:space-between;
}

/* Stats row */
.stats-row{
  display:flex;gap:10px;margin-bottom:28px;flex-wrap:wrap;
}
.stat-chip{
  flex:1;min-width:80px;
  border-radius:12px;
  padding:12px 14px;
  border:1px solid var(--border);
  background:var(--card);
  text-align:center;
}
.stat-num{
  font-family:'Syne',sans-serif;
  font-size:1.5rem;font-weight:800;
  line-height:1;
}
.stat-lbl{font-size:.68rem;color:var(--muted);margin-top:4px;font-weight:500}

/* ─── QUESTION CARD ──────────────────────────────────── */
.q-card{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:var(--radius);
  padding:22px 22px 18px;
  margin-bottom:12px;
  transition:border-color .25s, box-shadow .25s, transform .15s;
  position:relative;
  overflow:hidden;
}
.q-card:hover{
  border-color:var(--border2);
  box-shadow:0 4px 20px rgba(0,0,0,.3);
}
.q-card.answered-correct{
  border-color:rgba(34,197,94,.35);
  background:rgba(34,197,94,.04);
}
.q-card.answered-wrong{
  border-color:rgba(239,68,68,.3);
  background:rgba(239,68,68,.035);
}

.q-top{
  display:flex;align-items:center;gap:10px;
  margin-bottom:14px;
}
.q-num-badge{
  font-family:'DM Mono',monospace;
  font-size:.68rem;font-weight:500;
  padding:3px 9px;border-radius:999px;
  background:rgba(255,255,255,.07);
  border:1px solid var(--border2);
  flex-shrink:0;
}
.q-diff{
  font-family:'DM Mono',monospace;
  font-size:.63rem;font-weight:500;
  padding:2px 8px;border-radius:999px;
  flex-shrink:0;
}
.diff-e{background:rgba(34,197,94,.15);color:#4ade80;border:1px solid rgba(34,197,94,.25)}
.diff-m{background:rgba(245,158,11,.15);color:#fbbf24;border:1px solid rgba(245,158,11,.25)}
.diff-h{background:rgba(239,68,68,.15);color:#f87171;border:1px solid rgba(239,68,68,.25)}

.q-status-icon{
  margin-left:auto;
  font-size:1rem;
  opacity:0;
  transition:opacity .3s;
}
.answered-correct .q-status-icon{opacity:1}
.answered-wrong .q-status-icon{opacity:1}

.q-text{
  font-size:.975rem;
  font-weight:500;
  line-height:1.6;
  color:var(--text);
  margin-bottom:16px;
  padding-bottom:14px;
  border-bottom:1px solid var(--border);
}

/* ─── OPTIONS ────────────────────────────────────────── */
.options{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
}
@media(max-width:540px){.options{grid-template-columns:1fr}}

.opt{
  display:flex;align-items:flex-start;gap:10px;
  padding:10px 13px;
  border-radius:10px;
  border:1px solid var(--border);
  background:rgba(255,255,255,.025);
  font-size:.86rem;
  line-height:1.45;
  color:rgba(232,237,245,.8);
  transition:all .18s;
  cursor:pointer;
  text-align:left;
}
.opt:hover:not(:disabled){
  border-color:var(--border2);
  background:rgba(255,255,255,.055);
  color:var(--text);
  transform:translateY(-1px);
}
.opt:disabled{cursor:not-allowed;transform:none!important}

.opt-key{
  font-family:'DM Mono',monospace;
  font-size:.7rem;font-weight:500;
  min-width:20px;height:20px;
  border-radius:6px;
  background:rgba(255,255,255,.08);
  display:flex;align-items:center;justify-content:center;
  flex-shrink:0;margin-top:1px;
  transition:all .18s;
}
.opt.correct-opt{
  border-color:rgba(34,197,94,.5)!important;
  background:rgba(34,197,94,.1)!important;
  color:#dcfce7!important;
}
.opt.correct-opt .opt-key{background:rgba(34,197,94,.3);color:#4ade80}
.opt.wrong-opt{
  border-color:rgba(239,68,68,.45)!important;
  background:rgba(239,68,68,.09)!important;
  color:#fee2e2!important;
}
.opt.wrong-opt .opt-key{background:rgba(239,68,68,.3);color:#f87171}

/* ─── EXPLANATION ────────────────────────────────────── */
.explanation{
  display:none;
  margin-top:12px;
  padding:12px 14px;
  border-radius:10px;
  font-size:.82rem;
  line-height:1.6;
  border-left:3px solid;
}
.explanation.show{display:block}
.explanation.exp-correct{
  background:rgba(34,197,94,.07);
  border-color:var(--correct);
  color:#bbf7d0;
}
.explanation.exp-wrong{
  background:rgba(239,68,68,.07);
  border-color:var(--wrong);
  color:#fecaca;
}
.exp-label{font-weight:700;margin-right:6px}

/* ─── QUICK NAV DOTS ─────────────────────────────────── */
.dot-nav{
  display:flex;gap:4px;flex-wrap:wrap;
  margin-bottom:20px;
  padding:14px;
  background:var(--card);
  border:1px solid var(--border);
  border-radius:12px;
}
.dot{
  width:13px;height:13px;
  border-radius:50%;
  background:var(--dim);
  border:none;
  transition:all .2s;
  cursor:pointer;
  flex-shrink:0;
}
.dot:hover{transform:scale(1.3)}
.dot.dot-correct{background:var(--correct)}
.dot.dot-wrong{background:var(--wrong)}
.dot.dot-current{
  background:var(--accent-light,#fff);
  box-shadow:0 0 0 2px rgba(255,255,255,.15);
  transform:scale(1.25);
}

/* ─── CONTROLS ───────────────────────────────────────── */
.controls{
  position:sticky;bottom:0;
  z-index:8;
  padding:14px 0 8px;
  background:linear-gradient(0deg,var(--bg) 70%,transparent 100%);
  display:flex;gap:10px;flex-wrap:wrap;
  margin-top:16px;
}
.btn{
  display:inline-flex;align-items:center;gap:7px;
  padding:10px 20px;
  border-radius:10px;
  font-family:'Syne',sans-serif;
  font-size:.82rem;font-weight:700;
  letter-spacing:.2px;
  transition:all .2s;
}
.btn-primary{
  background:var(--accent);
  color:#000;
}
.btn-primary:hover{filter:brightness(1.1);transform:translateY(-1px)}
.btn-ghost{
  background:rgba(255,255,255,.06);
  color:var(--text);
  border:1px solid var(--border2);
}
.btn-ghost:hover{background:rgba(255,255,255,.1)}
.btn-danger{
  background:rgba(239,68,68,.12);
  color:#f87171;
  border:1px solid rgba(239,68,68,.25);
}
.btn-danger:hover{background:rgba(239,68,68,.2)}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none!important;filter:none!important}

/* ─── RESULT CARD ────────────────────────────────────── */
.result-panel{
  display:none;
  border-radius:20px;
  padding:36px 28px;
  text-align:center;
  border:1px solid var(--border2);
  background:var(--card);
  margin-bottom:24px;
  position:relative;overflow:hidden;
}
.result-panel.show{display:block}
.result-pct{
  font-family:'Syne',sans-serif;
  font-size:4.5rem;font-weight:800;
  line-height:1;
  background:linear-gradient(135deg,var(--accent) 0%,var(--accent-light,#fff) 100%);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
  background-clip:text;
}
.result-grade{
  display:inline-block;
  font-family:'Syne',sans-serif;
  font-size:1rem;font-weight:700;
  padding:5px 18px;border-radius:999px;
  margin:10px 0 20px;
}
.result-stats-row{
  display:flex;gap:12px;justify-content:center;flex-wrap:wrap;
}
.r-stat{
  background:rgba(255,255,255,.05);
  border:1px solid var(--border2);
  border-radius:12px;padding:14px 22px;
}
.r-stat-n{
  font-family:'Syne',sans-serif;
  font-size:2rem;font-weight:800;
  line-height:1;
}
.r-stat-l{font-size:.7rem;color:var(--muted);margin-top:4px}

/* ─── CHAPTER ACCENT COLORS ─────────────────────────── */
.ch-1 .ch-intro{background:linear-gradient(135deg,rgba(245,158,11,.08) 0%,var(--card) 60%)}
.ch-1 .ch-icon-big{background:rgba(245,158,11,.15)}
.ch-1 .progress-fill{background:var(--ch1)}
.ch-1 .tab-btn.active{border-bottom-color:var(--ch1);color:var(--ch1)}
.ch-1 .btn-primary{background:var(--ch1)}
.ch-1 .result-pct{background:linear-gradient(135deg,var(--ch1),#fde68a);-webkit-background-clip:text;background-clip:text}
.ch-1 .result-grade{background:rgba(245,158,11,.15);color:var(--ch1);border:1px solid rgba(245,158,11,.3)}

.ch-2 .ch-intro{background:linear-gradient(135deg,rgba(56,189,248,.08) 0%,var(--card) 60%)}
.ch-2 .ch-icon-big{background:rgba(56,189,248,.15)}
.ch-2 .progress-fill{background:var(--ch2)}
.ch-2 .tab-btn.active{border-bottom-color:var(--ch2);color:var(--ch2)}
.ch-2 .btn-primary{background:var(--ch2);color:#000}
.ch-2 .result-pct{background:linear-gradient(135deg,var(--ch2),#bae6fd);-webkit-background-clip:text;background-clip:text}
.ch-2 .result-grade{background:rgba(56,189,248,.15);color:var(--ch2);border:1px solid rgba(56,189,248,.3)}

.ch-3 .ch-intro{background:linear-gradient(135deg,rgba(244,63,94,.08) 0%,var(--card) 60%)}
.ch-3 .ch-icon-big{background:rgba(244,63,94,.15)}
.ch-3 .progress-fill{background:var(--ch3)}
.ch-3 .tab-btn.active{border-bottom-color:var(--ch3);color:var(--ch3)}
.ch-3 .btn-primary{background:var(--ch3)}
.ch-3 .result-pct{background:linear-gradient(135deg,var(--ch3),#fda4af);-webkit-background-clip:text;background-clip:text}
.ch-3 .result-grade{background:rgba(244,63,94,.15);color:var(--ch3);border:1px solid rgba(244,63,94,.3)}

.ch-4 .ch-intro{background:linear-gradient(135deg,rgba(167,139,250,.08) 0%,var(--card) 60%)}
.ch-4 .ch-icon-big{background:rgba(167,139,250,.15)}
.ch-4 .progress-fill{background:var(--ch4)}
.ch-4 .tab-btn.active{border-bottom-color:var(--ch4);color:var(--ch4)}
.ch-4 .btn-primary{background:var(--ch4);color:#000}
.ch-4 .result-pct{background:linear-gradient(135deg,var(--ch4),#ddd6fe);-webkit-background-clip:text;background-clip:text}
.ch-4 .result-grade{background:rgba(167,139,250,.15);color:var(--ch4);border:1px solid rgba(167,139,250,.3)}

.ch-5 .ch-intro{background:linear-gradient(135deg,rgba(52,211,153,.08) 0%,var(--card) 60%)}
.ch-5 .ch-icon-big{background:rgba(52,211,153,.15)}
.ch-5 .progress-fill{background:var(--ch5)}
.ch-5 .tab-btn.active{border-bottom-color:var(--ch5);color:var(--ch5)}
.ch-5 .btn-primary{background:var(--ch5);color:#000}
.ch-5 .result-pct{background:linear-gradient(135deg,var(--ch5),#a7f3d0);-webkit-background-clip:text;background-clip:text}
.ch-5 .result-grade{background:rgba(52,211,153,.15);color:var(--ch5);border:1px solid rgba(52,211,153,.3)}

/* ─── MISC ───────────────────────────────────────────── */
.kbd-hint{
  font-family:'DM Mono',monospace;
  font-size:.65rem;color:var(--muted);
  text-align:center;margin-top:6px;
}
.section-divider{
  height:1px;
  background:var(--border);
  margin:28px 0;
}
.filter-bar{
  display:flex;gap:8px;margin-bottom:20px;flex-wrap:wrap;
}
.filter-btn{
  font-family:'DM Mono',monospace;
  font-size:.68rem;font-weight:500;
  padding:5px 12px;border-radius:999px;
  border:1px solid var(--border2);
  background:rgba(255,255,255,.04);
  color:var(--muted);
  transition:all .18s;
}
.filter-btn:hover,.filter-btn.active-filter{
  background:rgba(255,255,255,.1);
  color:var(--text);
  border-color:rgba(255,255,255,.2);
}
.scroll-top{
  position:fixed;bottom:24px;right:24px;z-index:50;
  width:42px;height:42px;border-radius:50%;
  background:rgba(255,255,255,.1);
  border:1px solid var(--border2);
  color:var(--text);font-size:1.1rem;
  display:flex;align-items:center;justify-content:center;
  opacity:0;pointer-events:none;transition:all .3s;
  backdrop-filter:blur(8px);
}
.scroll-top.show{opacity:1;pointer-events:all}
.scroll-top:hover{background:rgba(255,255,255,.18);transform:translateY(-2px)}

@keyframes fadeSlideUp{
  from{opacity:0;transform:translateY(16px)}
  to{opacity:1;transform:translateY(0)}
}
.q-card{animation:fadeSlideUp .25s ease both}

@keyframes popIn{
  0%{transform:scale(.95);opacity:0}
  100%{transform:scale(1);opacity:1}
}
.result-panel.show{animation:popIn .35s ease both}

/* mobile */
@media(max-width:480px){
  .site-header{padding:16px}
  .main{padding:20px 14px 70px}
  .ch-name{font-size:1.2rem}
  .q-text{font-size:.9rem}
  .opt{font-size:.82rem}
  .result-pct{font-size:3.2rem}
}
</style>
</head>
<body>
<div class="bg-grid"></div>

<!-- ═══════ HEADER ═══════ -->
<header class="site-header">
  <div class="logo-ring"><img id="siteLogo" src="" alt="Scrutiny Academy Logo"></div>
  <div class="header-text">
    <div class="header-title">Class 10 Biology Quiz</div>
    <div class="header-sub">Scrutiny Academy &nbsp;·&nbsp; Chapters 1–5 &nbsp;·&nbsp; 250 Questions</div>
  </div>
  <div class="header-score-pill" id="globalPill">0 / 0 Answered</div>
</header>

<!-- ═══════ CHAPTER TABS ═══════ -->
<nav class="tab-bar" id="tabBar"></nav>

<!-- ═══════ MAIN ═══════ -->
<main class="main" id="mainContent"></main>

<!-- Scroll-to-top -->
<button class="scroll-top" id="scrollTop" onclick="window.scrollTo({top:0,behavior:'smooth'})">↑</button>

<script>
/* ════════════════════════════════════════════════════════
   CHAPTER METADATA
════════════════════════════════════════════════════════ */
const CHAPTERS = [
  { id:1, name:"Nutrition",              icon:"🌿", tagline:"Autotrophs · Heterotrophs · Photosynthesis · Digestion", color:"var(--ch1)" },
  { id:2, name:"Respiration",            icon:"🫁", tagline:"Aerobic · Anaerobic · ATP · Glycolysis · Krebs Cycle",  color:"var(--ch2)" },
  { id:3, name:"Transportation",         icon:"🩸", tagline:"Heart · Blood · Xylem · Phloem · Lymph · Circulation",  color:"var(--ch3)" },
  { id:4, name:"Excretion",              icon:"🧪", tagline:"Kidneys · Nephron · Urea · Dialysis · Osmoregulation",  color:"var(--ch4)" },
  { id:5, name:"Control & Coordination", icon:"🧠", tagline:"Neurons · Reflex · Hormones · Tropisms · Endocrine",    color:"var(--ch5)" },
];

/* ════════════════════════════════════════════════════════

   Each Q: { q, o:[4 opts], a:0-3 index, e:explanation, d:'e'|'m'|'h' }

 {q:"The large intestine primarily:",o:["Digests proteins","Absorbs water and forms faeces","Produces bile","Secretes insulin"],a:1,d:"e",e:"The colon absorbs water and electrolytes from the liquid chyme entering from the small intestine, compacting material into faeces."},
