  btn.className = 'tab-btn' + (ch.id === 1 ? ' active' : '');
  btn.id = `tab-${ch.id}`;
  btn.innerHTML = `<span class="tab-num">${ch.id < 10 ? '0'+ch.id : ch.id}</span>${ch.icon} ${ch.name}<span class="tab-check">✓</span>`;
  btn.onclick = () => switchChapter(ch.id);
  tabBar.appendChild(btn);
});

/* ════════════════════════════════════════════════════════
   BUILD CHAPTER PANELS
════════════════════════════════════════════════════════ */
const mainContent = document.getElementById('mainContent');
CHAPTERS.forEach(ch => {
  const panel = document.createElement('div');
  panel.className = `chapter-panel ch-${ch.id}` + (ch.id === 1 ? ' active' : '');
  panel.id = `panel-${ch.id}`;

  panel.innerHTML = `
    <div class="ch-intro" id="intro-${ch.id}">
      <div class="ch-intro-top">
        <div class="ch-icon-big">${ch.icon}</div>
        <div>
          <div class="ch-name">Chapter ${ch.id}: ${ch.name}</div>
          <div class="ch-tagline">${ch.tagline}</div>
        </div>
      </div>
      <div class="ch-meta-row">
        <span class="ch-meta-pill">📝 50 Questions</span>
        <span class="ch-meta-pill" id="meta-diff-${ch.id}">🟢 Easy · 🟡 Medium · 🔴 Hard</span>
        <span class="ch-meta-pill">⌨️ 1–4 keys to answer</span>
      </div>
    </div>

    <div class="stats-row" id="stats-${ch.id}">
      <div class="stat-chip">
        <div class="stat-num" id="sn-total-${ch.id}">50</div>
        <div class="stat-lbl">Total</div>
      </div>
      <div class="stat-chip">
        <div class="stat-num" id="sn-ans-${ch.id}" style="color:var(--muted)">0</div>
        <div class="stat-lbl">Answered</div>
      </div>
      <div class="stat-chip">
        <div class="stat-num" id="sn-cor-${ch.id}" style="color:var(--correct)">0</div>
        <div class="stat-lbl">Correct ✓</div>
      </div>
      <div class="stat-chip">
        <div class="stat-num" id="sn-wrg-${ch.id}" style="color:var(--wrong)">0</div>
        <div class="stat-lbl">Wrong ✗</div>
      </div>
    </div>

    <div class="progress-label">
      <span id="plbl-${ch.id}">Progress</span>
      <span id="ppct-${ch.id}">0 / 50</span>
    </div>
    <div class="progress-strip">
      <div class="progress-fill" id="pfill-${ch.id}" style="width:0%"></div>
    </div>

    <div class="filter-bar">
      <button class="filter-btn active-filter" onclick="setFilter(${ch.id},'all',this)">All</button>
      <button class="filter-btn" onclick="setFilter(${ch.id},'unanswered',this)">Unanswered</button>
      <button class="filter-btn" onclick="setFilter(${ch.id},'wrong',this)">Wrong</button>
      <button class="filter-btn" onclick="setFilter(${ch.id},'correct',this)">Correct</button>
    </div>

    <div class="dot-nav" id="dots-${ch.id}"></div>

    <div id="qarea-${ch.id}"></div>

    <div class="result-panel" id="result-${ch.id}"></div>

    <div class="controls">
      <button class="btn btn-primary" id="btn-prev-${ch.id}" onclick="navigate(${ch.id},-1)">← Prev</button>
      <button class="btn btn-primary" id="btn-next-${ch.id}" onclick="navigate(${ch.id},1)">Next →</button>
      <button class="btn btn-ghost" onclick="toggleShuffle(${ch.id})">🔀 Shuffle</button>
      <button class="btn btn-danger" onclick="resetChapter(${ch.id})">↺ Reset</button>
      <button class="btn btn-ghost" onclick="showResults(${ch.id})">📊 Results</button>
    </div>
    <div class="kbd-hint">Keyboard: ← → navigate &nbsp;|&nbsp; 1 2 3 4 = options &nbsp;|&nbsp; Space = next</div>
  `;
  mainContent.appendChild(panel);
});

/* ════════════════════════════════════════════════════════
   RENDER QUESTION
════════════════════════════════════════════════════════ */
function renderQuestion(cid) {
  const s = state[cid];
  const qi = s.order[s.current];
  const qd = QUIZ[cid][qi];
  const answered = s.answers[qi] !== null;
  const isCorrect = s.answers[qi] === true;
  const userPick = s.userPicks[qi];

  const keys = ['A','B','C','D'];
  let optsHtml = qd.o.map((opt, oi) => {
    let cls = 'opt';
    if (answered) {
      if (oi === qd.a) cls += ' correct-opt';
      else if (oi === userPick && oi !== qd.a) cls += ' wrong-opt';
    }
    return `<button class="${cls}" ${answered ? 'disabled' : ''} onclick="answer(${cid},${qi},${oi})">
      <span class="opt-key">${keys[oi]}</span><span>${opt}</span>
    </button>`;
  }).join('');

  const diffCls = {e:'diff-e',m:'diff-m',h:'diff-h'}[qd.d] || 'diff-e';
  const diffLabel = {e:'Easy',m:'Medium',h:'Hard'}[qd.d];
  const statusIcon = answered ? (isCorrect ? '✅' : '❌') : '';

  let expCls = '', expLabel = '';
  if (answered) {
    expCls = isCorrect ? 'exp-correct' : 'exp-wrong';
    expLabel = isCorrect ? '✅ Correct!' : '❌ Incorrect';
  }

  const cardCls = answered ? (isCorrect ? 'answered-correct' : 'answered-wrong') : '';

  document.getElementById(`qarea-${cid}`).innerHTML = `
    <div class="q-card ${cardCls}">
      <div class="q-top">
        <span class="q-num-badge">Q${s.current + 1} / 50</span>
        <span class="q-diff ${diffCls}">${diffLabel}</span>
        <span class="q-status-icon">${statusIcon}</span>
      </div>
      <div class="q-text">${qd.q}</div>
      <div class="options">${optsHtml}</div>
      <div class="explanation ${expCls} ${answered ? 'show' : ''}">
        <span class="exp-label">${expLabel}</span>${qd.e}
      </div>
    </div>`;

  updateStats(cid);
  renderDots(cid);
  updateNav(cid);
}

/* ════════════════════════════════════════════════════════
   ANSWER
════════════════════════════════════════════════════════ */
function answer(cid, qi, optIdx) {
  const s = state[cid];
  if (s.answers[qi] !== null) return;
  s.userPicks[qi] = optIdx;
  s.answers[qi] = optIdx === QUIZ[cid][qi].a;
  renderQuestion(cid);
}

/* ════════════════════════════════════════════════════════
   NAVIGATE
════════════════════════════════════════════════════════ */
function navigate(cid, dir) {
  const s = state[cid];
  s.current = Math.max(0, Math.min(s.order.length - 1, s.current + dir));
  renderQuestion(cid);
  window.scrollTo({top: document.querySelector('.tab-bar').getBoundingClientRect().bottom + window.scrollY - 10, behavior:'smooth'});
}

function updateNav(cid) {
  const s = state[cid];
  document.getElementById(`btn-prev-${cid}`).disabled = s.current === 0;
  document.getElementById(`btn-next-${cid}`).disabled = s.current === s.order.length - 1;
}

/* ════════════════════════════════════════════════════════
   STATS & PROGRESS
════════════════════════════════════════════════════════ */
function updateStats(cid) {
  const s = state[cid];
  const total = QUIZ[cid].length;
  const answered = s.answers.filter(a => a !== null).length;
  const correct = s.answers.filter(a => a === true).length;
  const wrong = s.answers.filter(a => a === false).length;
  const pct = Math.round(answered / total * 100);

  document.getElementById(`sn-ans-${cid}`).textContent = answered;
  document.getElementById(`sn-cor-${cid}`).textContent = correct;
  document.getElementById(`sn-wrg-${cid}`).textContent = wrong;
  document.getElementById(`pfill-${cid}`).style.width = pct + '%';
  document.getElementById(`ppct-${cid}`).textContent = `${answered} / ${total}`;

  // global pill
  let ga = 0, gt = 0;
  CHAPTERS.forEach(ch => {
    gt += QUIZ[ch.id].length;
    ga += state[ch.id].answers.filter(a => a !== null).length;
  });
  document.getElementById('globalPill').textContent = `${ga} / ${gt} Answered`;

  // mark tab as done
  if (answered === total) {
    document.getElementById(`tab-${cid}`)?.classList.add('done');
  }
}

/* ════════════════════════════════════════════════════════
   DOT NAV
════════════════════════════════════════════════════════ */
function renderDots(cid) {
  const s = state[cid];
  const container = document.getElementById(`dots-${cid}`);
  container.innerHTML = '';
  QUIZ[cid].forEach((_, qi) => {
    const dot = document.createElement('button');
    dot.className = 'dot';
    const ans = s.answers[qi];
    if (ans === true) dot.classList.add('dot-correct');
    else if (ans === false) dot.classList.add('dot-wrong');
    const posInOrder = s.order.indexOf(qi);
    if (posInOrder === s.current) dot.classList.add('dot-current');
    dot.title = `Q${qi + 1}`;
    dot.onclick = () => {
      const pos = s.order.indexOf(qi);
      if (pos !== -1) { s.current = pos; renderQuestion(cid); }
    };
    container.appendChild(dot);
  });
}

/* ════════════════════════════════════════════════════════
   FILTER
════════════════════════════════════════════════════════ */
function setFilter(cid, type, btn) {
  document.querySelectorAll(`#panel-${cid} .filter-btn`).forEach(b => b.classList.remove('active-filter'));
  btn.classList.add('active-filter');
  const s = state[cid];
  const allIdx = [...Array(QUIZ[cid].length).keys()];
  if (type === 'all') s.order = allIdx;
  else if (type === 'unanswered') s.order = allIdx.filter(i => s.answers[i] === null);
  else if (type === 'wrong') s.order = allIdx.filter(i => s.answers[i] === false);
  else if (type === 'correct') s.order = allIdx.filter(i => s.answers[i] === true);
  if (s.order.length === 0) s.order = allIdx;
  s.current = 0;
  renderQuestion(cid);
}

/* ════════════════════════════════════════════════════════
   SHUFFLE
════════════════════════════════════════════════════════ */
function toggleShuffle(cid) {
  const s = state[cid];
  const arr = [...s.order];
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  s.order = arr;
  s.current = 0;
  renderQuestion(cid);
}

/* ════════════════════════════════════════════════════════
   RESULTS
════════════════════════════════════════════════════════ */
function showResults(cid) {
  const s = state[cid];
  const total = QUIZ[cid].length;
  const correct = s.answers.filter(a => a === true).length;
  const wrong = s.answers.filter(a => a === false).length;
  const skip = s.answers.filter(a => a === null).length;
  const pct = Math.round(correct / total * 100);
  const grade = pct >= 90 ? ['A+','Outstanding! 🏆'] : pct >= 75 ? ['A','Excellent! 🎉'] :
                pct >= 60 ? ['B','Good work! 👍'] : pct >= 45 ? ['C','Keep going! 📚'] : ['D','More practice needed 💪'];
  const rp = document.getElementById(`result-${cid}`);
  rp.innerHTML = `
    <div class="result-pct">${pct}%</div>
    <div class="result-grade">Grade ${grade[0]} — ${grade[1]}</div>
    <div class="result-stats-row">
      <div class="r-stat"><div class="r-stat-n" style="color:var(--correct)">${correct}</div><div class="r-stat-l">✅ Correct</div></div>
      <div class="r-stat"><div class="r-stat-n" style="color:var(--wrong)">${wrong}</div><div class="r-stat-l">❌ Wrong</div></div>
      <div class="r-stat"><div class="r-stat-n" style="color:var(--muted)">${skip}</div><div class="r-stat-l">⏭ Skipped</div></div>
      <div class="r-stat"><div class="r-stat-n">${total}</div><div class="r-stat-l">📝 Total</div></div>
    </div>`;
  rp.classList.add('show');
  rp.scrollIntoView({behavior:'smooth', block:'nearest'});
}

/* ════════════════════════════════════════════════════════
   RESET
════════════════════════════════════════════════════════ */
function resetChapter(cid) {
  initChState(cid);
  document.getElementById(`result-${cid}`).classList.remove('show');
  document.getElementById(`result-${cid}`).innerHTML = '';
  document.getElementById(`tab-${cid}`)?.classList.remove('done');
  document.querySelectorAll(`#panel-${cid} .filter-btn`).forEach((b,i) => {
    b.classList.toggle('active-filter', i === 0);
  });
  renderQuestion(cid);
}

/* ════════════════════════════════════════════════════════
   SWITCH CHAPTER
════════════════════════════════════════════════════════ */
function switchChapter(cid) {
  activeChapter = cid;
  document.querySelectorAll('.chapter-panel').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(t => t.classList.remove('active'));
  document.getElementById(`panel-${cid}`).classList.add('active');
  document.getElementById(`tab-${cid}`).classList.add('active');
  // set accent css var on panel
  document.getElementById(`panel-${cid}`).style.setProperty('--accent', `var(--ch${cid})`);
  window.scrollTo({top: 0, behavior:'smooth'});
}

/* ════════════════════════════════════════════════════════
   KEYBOARD
════════════════════════════════════════════════════════ */
document.addEventListener('keydown', e => {
  const cid = activeChapter;
  const s = state[cid];
  const qi = s.order[s.current];
  if (e.key === 'ArrowRight' || e.key === ' ') { e.preventDefault(); navigate(cid, 1); }
  if (e.key === 'ArrowLeft') { e.preventDefault(); navigate(cid, -1); }
  if (['1','2','3','4'].includes(e.key)) {
    if (s.answers[qi] === null) answer(cid, qi, parseInt(e.key) - 1);
  }
});

/* ════════════════════════════════════════════════════════
   SCROLL-TO-TOP BUTTON
════════════════════════════════════════════════════════ */
window.addEventListener('scroll', () => {
  document.getElementById('scrollTop').classList.toggle('show', window.scrollY > 400);
});

/* ════════════════════════════════════════════════════════
   INIT
════════════════════════════════════════════════════════ */
CHAPTERS.forEach(ch => {
  renderQuestion(ch.id);
  document.getElementById(`panel-${ch.id}`).style.setProperty('--accent', `var(--ch${ch.id})`);
});
</script>
</body>
</html>
